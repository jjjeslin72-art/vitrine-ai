<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Vitrine AI</title>
<style>
:root{--bg:#FAF7F4;--card:#fff;--ink:#1F1A17;--sub:#7A6F68;--line:#ECE5DF;--acc:#B4536A;--acc2:#F6E7EB;--ok:#2F855A;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR","Segoe UI",Roboto,sans-serif;font-size:16px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
header h1{font-size:20px;margin:0;flex:1;letter-spacing:.3px;font-weight:800}
header h1 small{font-weight:500;color:var(--acc)}
#backBtn{font-size:22px;width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line)}
select{font:inherit;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
main{padding:16px;max-width:620px;margin:0 auto 90px}
.view{display:none}.view.on{display:block}
.plan{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:16px;font-size:14px}
.plan b{color:var(--acc)}
.plan .go{margin-left:auto;background:var(--ink);color:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 14px;text-align:left;min-height:132px;display:flex;flex-direction:column;gap:6px}
.mode .ic{font-size:30px}
.mode b{font-size:16px}
.mode span{font-size:13px;color:var(--sub);line-height:1.35}
.mode.main{grid-column:1/-1;background:var(--ink);color:#fff;border:0;min-height:110px}
.mode.main span{color:#D9CFC8}
h2{font-size:17px;margin:24px 0 10px}
h3{font-size:15px;margin:20px 0 8px;display:flex;align-items:center;gap:6px}
h3 em{font-style:normal;font-weight:500;color:var(--sub);font-size:13px}
.hint{font-size:13px;color:var(--sub);margin:-2px 0 8px;line-height:1.4}
.slots{display:flex;gap:10px;flex-wrap:wrap}
.slot{position:relative;width:96px;height:128px;border-radius:14px;border:2px dashed #D8CCC4;background:var(--card);display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:12px;color:var(--sub);overflow:hidden;gap:4px}
.slot .plus{font-size:28px;color:var(--acc)}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot.filled{border:1px solid var(--line)}
.slot .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:24px;z-index:2}
.slot.big{width:140px;height:186px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.row{margin-bottom:10px}
.row>label{display:block;font-size:13px;color:var(--sub);margin:0 0 6px}
.models{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.mcard{flex:0 0 auto;width:78px;text-align:center;font-size:12px}
.mcard .ph{width:78px;height:104px;border-radius:12px;overflow:hidden;border:2px solid transparent;background:var(--acc2);display:flex;align-items:center;justify-content:center;font-size:26px}
.mcard .ph img{width:100%;height:100%;object-fit:cover}
.mcard.on .ph{border-color:var(--acc)}
.mcard div:last-child{margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
textarea{width:100%;font:inherit;font-size:14px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);resize:vertical;min-height:60px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);z-index:6}
.bar .in{max-width:620px;margin:0 auto}
.btn{width:100%;padding:16px;border-radius:16px;background:var(--acc);color:#fff;font-weight:800;font-size:17px;box-shadow:0 6px 18px rgba(180,83,106,.3)}
.btn:disabled{background:#CDBFC3;box-shadow:none}
.btn2{padding:11px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;border-radius:14px;overflow:hidden;background:var(--acc2);aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;color:var(--sub);padding:0}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .lab{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;border-radius:8px;padding:2px 7px;font-size:11px}
.tile.err{background:#FBEAEA;color:#9B2C2C;padding:10px}
.spin{width:30px;height:30px;border:3px solid #E7D3D9;border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 8px}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{color:var(--sub);font-size:14px;text-align:center;padding:24px 8px;background:var(--card);border-radius:var(--r);border:1px dashed var(--line)}
#viewer{position:fixed;inset:0;background:rgba(15,12,10,.94);z-index:20;display:none;flex-direction:column}
#viewer.on{display:flex}
#viewer .img{flex:1;display:flex;align-items:center;justify-content:center;padding:12px;min-height:0}
#viewer img{max-width:100%;max-height:100%;border-radius:10px}
#viewer .acts{display:flex;gap:8px;padding:12px 12px calc(14px + env(safe-area-inset-bottom));flex-wrap:wrap;justify-content:center}
#viewer .acts button{background:#fff;color:var(--ink);border-radius:12px;padding:11px 14px;font-weight:700;font-size:14px}
#viewer .acts .wa{background:#25D366;color:#fff}
#viewer .close{position:absolute;top:10px;right:12px;color:#fff;font-size:28px;width:44px;height:44px}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:30;display:none;max-width:88vw;text-align:center}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25;display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet .box{background:var(--bg);width:100%;max-width:620px;margin:0 auto;border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h2{margin-top:0}
.price{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.price div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.price b{font-size:18px}
.price .best{border:2px solid var(--acc)}
.ver{text-align:center;color:#B9ADA5;font-size:11px;margin-top:28px}
.sw{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px;font-size:14px}
</style>
</head>
<body>
<header>
  <button id="backBtn" hidden aria-label="back">‹</button>
  <h1 id="appName">Vitrine <small>AI</small></h1>
  <select id="langBtn" aria-label="language"></select>
</header>

<main>
  <!-- 첫 화면 -->
  <section class="view on" id="v-home">
    <div class="plan" id="planBox"></div>
    <div class="modes">
      <button class="mode main" data-mode="dress"><div class="ic">👗</div><b data-t="m1"></b><span data-t="m1d"></span></button>
      <button class="mode" data-mode="swap"><div class="ic">🔄</div><b data-t="m2"></b><span data-t="m2d"></span></button>
      <button class="mode" data-mode="bg"><div class="ic">🏙️</div><b data-t="m3"></b><span data-t="m3d"></span></button>
      <button class="mode" data-mode="model" style="grid-column:1/-1;min-height:auto"><div class="ic" style="font-size:24px">👩🏽</div><b data-t="m4"></b><span data-t="m4d"></span></button>
    </div>
    <h2 data-t="myPhotos"></h2>
    <div id="gallery" class="grid"></div>
    <div class="ver" id="ver"></div>
  </section>

  <!-- 작업 화면 (4가지 공용) -->
  <section class="view" id="v-work">
    <h2 id="workTitle" style="margin-top:4px"></h2>
    <p class="hint" id="workHint"></p>

    <div id="secPerson">
      <h3 data-t="personPhoto"></h3>
      <p class="hint" id="personHint"></p>
      <div class="slots" id="personSlots"></div>
    </div>

    <div id="secClothes">
      <h3><span data-t="clothes"></span> <em data-t="upTo3"></em></h3>
      <p class="hint" data-t="clothesHint"></p>
      <div class="slots" id="clothSlots"></div>
    </div>

    <div id="secModel">
      <h3 data-t="whoWears"></h3>
      <div class="models" id="modelPick"></div>
      <div id="presetBox" style="margin-top:12px"></div>
    </div>

    <div id="secPose">
      <h3><span data-t="pose"></span> <em data-t="poseMany"></em></h3>
      <div class="chips" id="poseChips"></div>
    </div>

    <div id="secBg">
      <h3 data-t="background"></h3>
      <div class="chips" id="bgChips"></div>
    </div>

    <div id="secRatio">
      <h3 data-t="ratio"></h3>
      <div class="chips" id="ratioChips"></div>
    </div>

    <div id="secName" hidden>
      <h3 data-t="modelName"></h3>
      <textarea id="modelName" rows="1" style="min-height:44px"></textarea>
    </div>

    <h3><span data-t="extra"></span> <em data-t="optional"></em></h3>
    <textarea id="extra"></textarea>
  </section>

  <!-- 결과 화면 -->
  <section class="view" id="v-result">
    <h2 data-t="results" style="margin-top:4px"></h2>
    <p class="hint" data-t="tapToSave"></p>
    <div class="grid" id="resultGrid"></div>
    <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
      <button class="btn2" id="againBtn" data-t="again"></button>
      <button class="btn2" id="editBtn" data-t="editOpts"></button>
      <button class="btn2" id="saveAllBtn" data-t="saveAll"></button>
    </div>
  </section>
</main>

<div class="bar" id="bar" hidden><div class="in"><button class="btn" id="goBtn"></button></div></div>

<div id="viewer">
  <button class="close" id="vClose">✕</button>
  <div class="img"><img id="vImg" alt=""></div>
  <div class="acts">
    <button id="vSave" data-t="save"></button>
    <button class="wa" id="vWa">WhatsApp</button>
    <button id="vShare" data-t="share"></button>
    <button id="vModel" data-t="useAsModel"></button>
    <button id="vBg" data-t="changeBg"></button>
    <button id="vDel" data-t="del"></button>
  </div>
</div>

<div class="sheet" id="planSheet"><div class="box">
  <h2 data-t="premiumTitle"></h2>
  <p class="hint" data-t="premiumDesc"></p>
  <div class="price">
    <div><b data-t="p1"></b><br><span class="hint" data-t="p1d"></span></div>
    <div class="best"><b data-t="p2"></b><br><span class="hint" data-t="p2d"></span></div>
    <div><b data-t="p3"></b><br><span class="hint" data-t="p3d"></span></div>
  </div>
  <p class="hint" data-t="soon"></p>
  <div class="sw" id="testSw" hidden><span data-t="testPremium"></span><input type="checkbox" id="testChk"></div>
  <button class="btn2" style="width:100%;margin-top:14px" id="planClose" data-t="close"></button>
</div></div>

<input type="file" id="fileIn" accept="image/*" hidden>
<div id="toast"></div>

let db=null;
const dbOpen=()=>new Promise(res=>{try{const r=indexedDB.open('vitrine-ai',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('photos',{keyPath:'id'});d.createObjectStore('models',{keyPath:'id'});};r.onsuccess=()=>{db=r.result;res();};r.onerror=()=>res();}catch(e){res();}});
const dbAll=s=>new Promise(res=>{if(!db)return res([]);const q=db.transaction(s).objectStore(s).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([]);});
const dbPut=(s,v)=>new Promise(res=>{if(!db)return res();const tx=db.transaction(s,'readwrite');tx.objectStore(s).put(v);tx.oncomplete=()=>res();tx.onerror=()=>res();});
const dbDel=(s,id)=>new Promise(res=>{if(!db)return res();const tx=db.transaction(s,'readwrite');tx.objectStore(s).delete(id);tx.oncomplete=()=>res();tx.onerror=()=>res();});

let fileResolve=null;
$('#fileIn').onchange=e=>{const f=e.target.files&&e.target.files[0];e.target.value='';const r=fileResolve;fileResolve=null;if(!f){r&&r(null);return;}
  const rd=new FileReader();rd.onload=()=>r&&r(rd.result);rd.onerror=()=>r&&r(null);rd.readAsDataURL(f);};
const pickImage=()=>new Promise(res=>{fileResolve=res;$('#fileIn').click();});
const loadImg=src=>new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=src;});
async function shrink(url,max=1280,q=0.9){
  const im=await loadImg(url);if(!im)return null;
  const sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');
  c.width=Math.round(im.naturalWidth*sc);c.height=Math.round(im.naturalHeight*sc);const g=c.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q);
}
async function addPhoto(kind){
  const raw=await pickImage();if(!raw)return;const u=await shrink(raw);if(!u){toast(t('failed'));return;}
  if(kind==='person')S.person=u;else if(S.clothes.length<3)S.clothes.push(u);
  renderSlots();renderGo();
}
window.__receiveImage=async d=>{const u=await shrink(d);if(!u)return;openMode('dress');S.clothes=[u];renderSlots();renderGo();};

function slotEl(img,onAdd,onDel,big){
  const b=document.createElement('button');b.className='slot'+(img?' filled':'')+(big?' big':'');
  if(img){b.innerHTML=`<img src="${img}" alt=""><span class="x">✕</span>`;b.querySelector('.x').onclick=e=>{e.stopPropagation();onDel();};}
  else{b.innerHTML=`<span class="plus">＋</span><span>${t('addPhoto')}</span>`;b.onclick=onAdd;}
  return b;
}
function renderSlots(){
  const ps=$('#personSlots');ps.innerHTML='';
  ps.append(slotEl(S.person,()=>addPhoto('person'),()=>{S.person=null;renderSlots();renderGo();},true));
  const cs=$('#clothSlots');cs.innerHTML='';
  S.clothes.forEach((c,i)=>cs.append(slotEl(c,null,()=>{S.clothes.splice(i,1);renderSlots();renderGo();})));
  if(S.clothes.length<3)cs.append(slotEl(null,()=>addPhoto('cloth')));
}
function chips(el,list,isOn,onTap){
  el.innerHTML='';for(const o of list){const b=document.createElement('button');b.className='chip'+(isOn(o.id)?' on':'');b.textContent=nm(o);b.onclick=()=>{onTap(o.id);};el.append(b);}
}
function renderPresets(){
  const box=$('#presetBox');box.innerHTML='';box.hidden=(S.mode==='dress'&&S.modelId!=='ai');
  for(const k of ['gender','look','body','age']){
    const r=document.createElement('div');r.className='row';r.innerHTML=`<label>${t(k)}</label><div class="chips"></div>`;
    chips(r.querySelector('.chips'),OPT[k],id=>S[k]===id,id=>{S[k]=id;renderPresets();});box.append(r);
  }
}
function renderModels(){
  const el=$('#modelPick');el.innerHTML='';
  const mk=(id,html,label)=>{const d=document.createElement('button');d.className='mcard'+(S.modelId===id?' on':'');d.innerHTML=`<div class="ph">${html}</div><div>${label}</div>`;
    d.onclick=()=>{S.modelId=id;renderModels();renderPresets();};
    if(id!=='ai'){let tm;d.addEventListener('touchstart',()=>{tm=setTimeout(async()=>{if(confirm(t('delModel'))){await dbDel('models',id);models=models.filter(m=>m.id!==id);if(S.modelId===id)S.modelId='ai';renderModels();renderPresets();}},700);},{passive:true});
      d.addEventListener('touchend',()=>clearTimeout(tm));d.addEventListener('contextmenu',e=>e.preventDefault());}
    el.append(d);};
  mk('ai','✨',t('aiModel'));
  for(const m of models)mk(m.id,`<img src="${m.img}" alt="">`,m.name||t('modelDefault'));
}
function renderChoices(){
  chips($('#poseChips'),OPT.pose,id=>S.poses.includes(id),id=>{
    if(S.poses.includes(id)){if(S.poses.length>1)S.poses=S.poses.filter(x=>x!==id);}else if(S.poses.length<4)S.poses.push(id);renderChoices();renderGo();});
  const bgs=OPT.bg.filter(o=>o.id!=='keep'||S.mode==='swap');
  chips($('#bgChips'),bgs,id=>S.bg===id,id=>{S.bg=id;renderChoices();});
  chips($('#ratioChips'),OPT.ratio,id=>S.ratio===id,id=>{S.ratio=id;renderChoices();});
}
function shotCount(){return S.mode==='dress'?S.poses.length:1;}
function renderGo(){

function openMode(m){

/* ---------- AI 부탁문 만들기 ---------- */
const pick=(k,id)=>OPT[k].find(o=>o.id===id)||OPT[k][0];
function modelDesc(){
  const g=pick('gender',S.gender).p;
  return `a professional ${pick('look',S.look).p} ${g} fashion model, ${pick('age',S.age).p}, with a ${pick('body',S.body).p}, natural friendly expression`;
}
const KEEP_CLOTH='Reproduce every garment faithfully: exactly the same colors, fabric and texture, print or pattern, neckline, sleeves, length, fit, buttons, zippers, embroidery and any text or logo printed on it. Do not redesign, recolor or add anything to the clothes. Remove any hanger, mannequin, price tag or packaging and the creases from folding, so it looks naturally worn.';
const QUALITY='High-end e-commerce fashion catalog photography, photorealistic, realistic skin and hands, soft flattering studio-quality light, sharp focus on the clothing. Do not add any text, logo or watermark to the image.';
function buildJobs(){
  const extra=$('#extra').value.trim().slice(0,300);
  const ex=extra?` Extra request from the shop owner: ${extra}.`:'';
  const bg=pick('bg',S.bg).p;
  const clothImgs=S.clothes.map(c=>({mime:'image/jpeg',data:c.split(',')[1]}));
  const jobs=[];
  if(S.mode==='dress'){
    const saved=models.find(m=>m.id===S.modelId);
    for(const pid of S.poses){
      const pose=pick('pose',pid);
      let p=`Create a fashion product photo. The first ${clothImgs.length>1?clothImgs.length+' images show the garments':'image shows the garment'} to sell. `;
      p+=saved?`The last image is the shop's model: use exactly the same person (same face, hair, skin tone and body shape) wearing ${clothImgs.length>1?'all these garments together as one outfit':'this garment'}. `
              :`Show ${modelDesc()} wearing ${clothImgs.length>1?'all these garments together as one outfit':'this garment'}. `;
      p+=`${KEEP_CLOTH} Complete the look with simple neutral shoes and no extra accessories that hide the clothes. Pose: ${pose.p}. Background: ${bg}. ${QUALITY}${ex}`;
      const imgs=[...clothImgs];if(saved)imgs.push({mime:'image/jpeg',data:saved.img.split(',')[1]});
      jobs.push({label:nm(pose),prompt:p,imgs});
    }
  }else if(S.mode==='swap'){
    let p=`The first image is a photo of a person. The following ${clothImgs.length>1?'images show garments':'image shows a garment'}. Dress the same person in ${clothImgs.length>1?'these garments as one outfit':'this garment'}, replacing their current clothes. Keep the person's face, hair, skin tone, body shape and pose exactly the same. ${KEEP_CLOTH} Background: ${bg}. ${QUALITY}${ex}`;
    jobs.push({label:nm(pick('bg',S.bg)),prompt:p,imgs:[{mime:'image/jpeg',data:S.person.split(',')[1]},...clothImgs]});
  }else if(S.mode==='bg'){
    const p=`Keep the person and their clothing in this photo exactly the same: do not change the clothes, colors, face, body or pose at all. Replace only the background with: ${bg}. Match the light direction, colors and shadows so it looks like a real photo taken there. ${QUALITY}${ex}`;
    jobs.push({label:nm(pick('bg',S.bg)),prompt:p,imgs:[{mime:'image/jpeg',data:S.person.split(',')[1]}]});
  }else{
    const p=`Full-body photo of ${modelDesc()}, standing straight facing the camera, wearing a simple fitted plain black tank top and black leggings and plain sneakers, hair neat, against a clean seamless white studio background. This is a reference photo of the shop's regular model, so show the face and whole body clearly. ${QUALITY}${ex}`;
    jobs.push({label:t('newModel'),prompt:p,imgs:[]});
  }
  return jobs;
}

let aiCfg=null;try{aiCfg=AB&&AB.aiConfig?JSON.parse(AB.aiConfig()):null;}catch(e){aiCfg=null;}
const aiReady=()=>!!(aiCfg&&((aiCfg.url&&aiCfg.key)||aiCfg.gemini));
// 좋은 순서대로 시도: 표준 → 고급(Pro) → 가벼운 모델
const MODELS=['gemini-3.1-flash-image','gemini-3-pro-image','gemini-3.1-flash-lite-image'];
async function callGemini(job,signal){
  const parts=[{text:job.prompt},...job.imgs.map(i=>({inline_data:{mime_type:i.mime,data:i.data}}))];
  let last='';
  for(const model of MODELS){
    let r,d;
    try{r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,{method:'POST',signal,
      headers:{'content-type':'application/json','x-goog-api-key':aiCfg.gemini},
      body:JSON.stringify({contents:[{role:'user',parts}],generationConfig:{responseModalities:['IMAGE'],imageConfig:{aspectRatio:S.ratio,imageSize:'1K'}}})});
      d=await r.json().catch(()=>({}));}catch(e){if(e.name==='AbortError')throw e;last=String(e.message||e);continue;}
    if(r.status===429)return {status:429};
    if(!r.ok){last=(d.error&&d.error.message)||('http '+r.status);continue;}
    const out=((d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts)||[]).find(x=>x.inlineData||x.inline_data);
    const img=out&&(out.inlineData||out.inline_data);
    if(img&&img.data)return {status:200,image:img.data,mime:img.mimeType||img.mime_type||'image/png'};
    last=(d.candidates&&d.candidates[0]&&d.candidates[0].finishReason)||(d.promptFeedback&&d.promptFeedback.blockReason)||'no image';
  }
  return {status:502,message:last};
}
async function callServer(job,signal){
  const r=await fetch(aiCfg.url.replace(/\/$/,'')+'/generate',{method:'POST',signal,headers:{'content-type':'application/json','x-app-key':aiCfg.key,'x-device':aiCfg.device},
    body:JSON.stringify({prompt:job.prompt,images:job.imgs,ratio:S.ratio})});
  const d=await r.json().catch(()=>({}));
  if(r.status===429)return {status:429};
  if(!r.ok||!d.image)return {status:502,message:d.message||d.error||('http '+r.status)};
  return {status:200,image:d.image,mime:d.mime||'image/png'};
}
async function generate(job){
  const server=!!(aiCfg.url&&aiCfg.key);
  let lastMsg='';
  for(let a=0;a<3;a++){
    const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),120000);
    try{
      const d=server?await callServer(job,ctl.signal):await callGemini(job,ctl.signal);
      if(d.status===429){await sleep(12000);continue;}
      if(d.status===200)return `data:${d.mime};base64,${d.image}`;
      lastMsg=d.message||'';if(a<1){await sleep(2000);continue;}
      break;
    }catch(e){if(e.name==='AbortError')throw new Error(t('slow'));if(e instanceof TypeError)throw new Error(t('net'));throw e;}
    finally{clearTimeout(to);}
  }
  const e=new Error(t('failed'));e.detail=lastMsg;throw e;
}

/* ---------- 로고(무료 사진) ---------- */
async function stamp(url){
  if(isPremium())return url;
  const im=await loadImg(url);if(!im)return url;
  const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;const g=c.getContext('2d');g.drawImage(im,0,0);
  const fs=Math.round(c.width*0.035);g.font=`700 ${fs}px system-ui,sans-serif`;g.textAlign='right';g.textBaseline='bottom';
  const txt='Vitrine AI';const pad=Math.round(fs*0.7);
  g.fillStyle='rgba(0,0,0,.28)';g.fillText(txt,c.width-pad+2,c.height-pad+2);g.fillStyle='rgba(255,255,255,.85)';g.fillText(txt,c.width-pad,c.height-pad);
  return c.toDataURL('image/jpeg',0.93);
}

/* ---------- 만들기 ---------- */
$('#goBtn').onclick=async()=>{
  if((S.mode==='swap'||S.mode==='bg')&&!S.person)return toast(t('needPerson'));
  if((S.mode==='dress'||S.mode==='swap')&&!S.clothes.length)return toast(t('needCloth'));
  if(S.mode==='model'&&S.person){ // 실제 모델 사진을 바로 저장
    await saveModel(S.person,$('#modelName').value.trim());S.person=null;show('home');return;
  }
  if(!aiReady())return toast(t('noAI'));
  const jobs=buildJobs();
  if(!isPremium()&&trialLeft()<jobs.length){toast(t('trialOver'));openPlan();return;}
  if(usedToday()+jobs.length>DAILY_CAP)return toast(t('limit'));
  runJobs(jobs,S.mode,$('#modelName').value.trim());
};
async function runJobs(jobs,mode,modelName){
  lastJob={jobs,mode,modelName};
  show('result');
  const grid=$('#resultGrid');grid.innerHTML='';grid.style.setProperty('--ar',S.ratio.replace(':','/'));
  const tiles=jobs.map(j=>{const d=document.createElement('div');d.className='tile';d.style.aspectRatio=S.ratio.replace(':','/');d.innerHTML=`<div><div class="spin"></div>${t('working')}</div><span class="lab">${j.label}</span>`;grid.append(d);return d;});
  $('#againBtn').disabled=true;
  for(let i=0;i<jobs.length;i++){
    const tile=tiles[i];
    try{
      const raw=await generate(jobs[i]);markUsed();
      const img=await stamp(raw);
      const rec={id:uid(),ts:Date.now(),mode,img};
      if(mode==='model'){await saveModel(raw,modelName);}
      await dbPut('photos',rec);
      tile.innerHTML=`<img src="${img}" alt=""><span class="lab">${jobs[i].label}</span>`;tile.onclick=()=>openViewer(rec);
    }catch(e){
      tile.className='tile err';tile.innerHTML=`<div>⚠️ ${e.message}${e.detail?`<br><small style="opacity:.7">${String(e.detail).slice(0,120)}</small>`:''}</div>`;
    }
  }
  $('#againBtn').disabled=false;
}
$('#againBtn').onclick=()=>{if(!lastJob)return;if(!isPremium()&&trialLeft()<lastJob.jobs.length){toast(t('trialOver'));openPlan();return;}runJobs(lastJob.jobs,lastJob.mode,lastJob.modelName);};
$('#editBtn').onclick=()=>show('work');
$('#saveAllBtn').onclick=async()=>{const imgs=$$('#resultGrid img');let n=0;for(const im of imgs){if(await saveImg(im.src))n++;}if(n)toast(t('saved'));};

async function saveModel(img,name){
  const m={id:uid(),ts:Date.now(),name:name||`${t('modelDefault')} ${models.length+1}`,img:await shrink(img,1024,0.9)};
  await dbPut('models',m);models.push(m);S.modelId=m.id;toast(t('modelSaved'));
}

/* ---------- 크게 보기 / 저장 / 보내기 ---------- */
function openViewer(p){viewing=p;$('#vImg').src=p.img;$('#viewer').classList.add('on');}
function closeViewer(){$('#viewer').classList.remove('on');viewing=null;}
$('#vClose').onclick=closeViewer;
const fname=()=>'vitrine_'+new Date().toISOString().replace(/[-:T]/g,'').slice(0,14)+'_'+Math.random().toString(36).slice(2,5)+'.jpg';
async function asJpeg(url){if(url.startsWith('data:image/jpeg'))return url;const im=await loadImg(url);const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0);return c.toDataURL('image/jpeg',0.94);}
async function saveImg(url){
  const j=await asJpeg(url);
  if(AB&&AB.saveFile){const r=AB.saveFile(fname(),j.split(',')[1],'image/jpeg','');if(r.startsWith('ok')){return true;}toast(r.slice(4));return false;}
  const a=document.createElement('a');a.href=j;a.download=fname();a.click();return true;
}
$('#vSave').onclick=async()=>{if(viewing&&await saveImg(viewing.img))toast(t('saved'));};
$('#vWa').onclick=async()=>{if(!viewing)return;const j=await asJpeg(viewing.img);if(AB&&AB.shareTo)AB.shareTo(fname(),j.split(',')[1],'image/jpeg','com.whatsapp');else toast(t('noAI'));};
$('#vShare').onclick=async()=>{if(!viewing)return;const j=await asJpeg(viewing.img);if(AB&&AB.shareFile)AB.shareFile(fname(),j.split(',')[1],'image/jpeg');else toast(t('noAI'));};
$('#vModel').onclick=async()=>{if(!viewing)return;await saveModel(viewing.img,'');closeViewer();};
$('#vBg').onclick=()=>{if(!viewing)return;const img=viewing.img;closeViewer();S.person=img;openMode('bg');};
$('#vDel').onclick=async()=>{if(!viewing)return;await dbDel('photos',viewing.id);closeViewer();toast(t('deleted'));if(cur==='home')renderGallery();};

let toastT;function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>e.style.display='none',2600);}

/* ---------- 언어 ---------- */
function applyLang(){
  document.documentElement.lang=lang;
  const sel=$('#langBtn');if(!sel.options.length)for(const l of LANGS)sel.append(new Option(LNAME[l],l));sel.value=lang;
  $$('[data-t]').forEach(e=>{e.textContent=t(e.dataset.t);});
  $('#extra').placeholder=t('extraPh');
  renderPlan();
  if(cur==='work')openMode(S.mode);
  if(cur==='home')renderGallery();
}
$('#langBtn').onchange=e=>{lang=e.target.value;lsSet('lang',lang);applyLang();};

/* ---------- 시작 ---------- */
(async()=>{
  await dbOpen();models=(await dbAll('models')).sort((a,b)=>a.ts-b.ts);
  applyLang();show('home');
  try{$('#ver').textContent='Vitrine AI v'+(AB&&AB.appVersion?AB.appVersion():'web');}catch(e){}
})();
</script>
