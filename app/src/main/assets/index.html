<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Click.moda AI</title>
<style>
:root{--bg:#0D0B0A;--card:#191513;--ink:#F4EDE3;--sub:#A3978A;--line:#2C2622;--acc:#D9B26E;--acc2:#2A221B;--gold:#D9B26E;--gold2:#4A3B29;--gg:linear-gradient(100deg,#F3D99E,#C9984F);--on:#1A1208;--serif:'Noto Serif','Noto Serif KR','Playfair Display',Georgia,'Times New Roman',serif;--ok:#2F855A;--r:18px}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR","Segoe UI",Roboto,sans-serif;font-size:16px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#fontBtn{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-weight:800;font-size:16px;color:var(--ink);padding:0}
#fontBtn sup{font-size:10px;color:var(--gold)}
body>:not(header){zoom:var(--z,1)}
body>#nav{zoom:var(--zn,1)}
body>#viewer{zoom:var(--zv,1)}
/* 큰 사진 칸(첫 화면 화보·스튜디오 카드)은 글자 크기와 상관없이 늘 보통 크기 — 핸드폰 한 화면에 딱 보이게 */
#v-home .hero,#v-home .tools{zoom:var(--zr,1)}
/* 스튜디오 카드: 옆으로 밀지 않고 한 화면에 모두 (2장씩, 동영상은 한 줄 전체) */
#v-home .tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;overflow:visible;margin:0;padding:2px 0 4px}
#v-home .tools .tool{min-height:190px;width:auto}
#v-home .tools .tool.wide{grid-column:1/-1;min-height:150px}
/* 거절 안내 줄·만든 사진 제목·사진 칸도 너무 커지지 않게 (최대 1.25배) — 한 줄에 딱 */
.view .helpRow,.view .sec,.view .usage,.view .grid{zoom:var(--zm,1)}
.view .sec h3,.view .sec .right,.view #galCount,.view .selbtn{white-space:nowrap}
.view .helpRow b{line-height:1.35}
#nav button{min-width:44px!important;flex:1 1 0}#nav .plus{flex:none!important;min-width:58px!important} /* 아래 메뉴는 너무 커지면 버튼이 안 들어가서 1.2배까지만 */
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
header h1{font-size:20px;margin:0;flex:1;letter-spacing:.3px;font-weight:800}
header h1 small{font-weight:500;color:var(--acc)}
#backBtn{font-size:22px;width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line)}
select{font:inherit;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
main{padding:16px;max-width:620px;margin:0 auto 90px}
.view{display:none}.view.on{display:block}
.plan{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:16px;font-size:14px}
.plan b{color:var(--acc)}
.plan .go{margin-left:auto;background:var(--ink);color:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 14px;text-align:left;min-height:132px;display:flex;flex-direction:column;gap:6px}
.mode .ic{font-size:30px}
.mode b{font-size:16px}
.mode span{font-size:13px;color:var(--sub);line-height:1.35}
.mode.main{grid-column:1/-1;background:var(--ink);color:#fff;border:0;min-height:110px}
.mode.main span{color:#D9CFC8}
h2{font-size:17px;margin:24px 0 10px}
h3{font-size:15px;margin:20px 0 8px;display:flex;align-items:center;gap:6px}
h3 em{font-style:normal;font-weight:500;color:var(--sub);font-size:13px}
.hint{font-size:13px;color:var(--sub);margin:-2px 0 8px;line-height:1.4}
.slots{display:flex;gap:10px;flex-wrap:wrap}
.slot{position:relative;width:96px;height:128px;border-radius:14px;border:2px dashed #D8CCC4;background:var(--card);display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:12px;color:var(--sub);overflow:hidden;gap:4px}
.slot .plus{font-size:28px;color:var(--acc)}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot.filled{border:1px solid var(--line)}
.slot .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:24px;z-index:2}
.slot.big{width:140px;height:186px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px}
.chip.add{border-style:dashed;color:var(--gold);border-color:var(--gold);background:transparent}
.chip.cust{position:relative;padding-right:30px}.chip .cx{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;opacity:.6;padding:4px}
#custSheet{z-index:28}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.row{margin-bottom:10px}
.row>label{display:block;font-size:13px;color:var(--sub);margin:0 0 6px}
.models{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.mcard{flex:0 0 auto;width:78px;text-align:center;font-size:12px}
.mcard .ph{width:78px;height:104px;border-radius:12px;overflow:hidden;border:2px solid transparent;background:var(--acc2);display:flex;align-items:center;justify-content:center;font-size:26px}
.mcard .ph img{width:100%;height:100%;object-fit:cover}
.mcard.on .ph{border-color:var(--acc)}
.mcard{position:relative}.mdel{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;background:rgba(21,18,16,.7);color:#fff;font-size:13px;line-height:26px;text-align:center;z-index:2}
.mcard div:last-child{margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
textarea{width:100%;font:inherit;font-size:14px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);resize:vertical;min-height:60px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);z-index:6}
.bar .in{max-width:620px;margin:0 auto}
.btn{width:100%;padding:16px;border-radius:16px;background:var(--acc);color:#fff;font-weight:800;font-size:17px;box-shadow:0 6px 18px rgba(180,83,106,.3)}
.btn:disabled{background:#CDBFC3;box-shadow:none}
.btn2{padding:11px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;border-radius:14px;overflow:hidden;background:var(--acc2);aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;color:var(--sub);padding:0}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .lab{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;border-radius:8px;padding:2px 7px;font-size:11px}
.tile.err{background:#FBEAEA;color:#9B2C2C;padding:10px}
.spin{width:30px;height:30px;border:3px solid #E7D3D9;border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 8px}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{color:var(--sub);font-size:14px;text-align:center;padding:24px 8px;background:var(--card);border-radius:var(--r);border:1px dashed var(--line)}
#viewer{position:fixed;inset:0;background:#0F0C0A;z-index:20;display:none;flex-direction:column}
#viewer.on{display:flex}
#viewer .img{flex:1;display:flex;align-items:center;justify-content:center;padding:12px;min-height:0}
#viewer img{max-width:100%;max-height:100%;border-radius:10px;transform-origin:0 0;will-change:transform;touch-action:none;user-select:none;-webkit-user-drag:none}
#viewer .img{overflow:hidden;touch-action:none}
#zoomHint{position:absolute;z-index:2;top:16px;left:16px;color:#fff;opacity:.75;font-size:13px;background:rgba(0,0,0,.35);padding:5px 10px;border-radius:10px;pointer-events:none}
#viewer .tools2{position:relative;z-index:2;background:#0F0C0A;display:flex;gap:6px;overflow-x:auto;padding:2px 12px calc(14px + env(safe-area-inset-bottom));scrollbar-width:none}
#viewer .tools2::-webkit-scrollbar{display:none}
#viewer .tools2 button{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:66px;padding:9px 6px;border-radius:14px;background:#221D1A;color:#EDE4D8;font-size:11.5px;font-weight:600}
#viewer .tools2 button i{font-style:normal;font-size:20px}
#viewer .acts{position:relative;z-index:2;background:#0F0C0A;display:flex;gap:8px;padding:12px 12px 10px;flex-wrap:wrap;justify-content:center}
#viewer .acts button{flex:1;background:#fff;color:var(--ink);border-radius:12px;padding:11px 14px;font-weight:700;font-size:14px}
#viewer .acts .wa{background:#25D366;color:#fff}
#viewer .acts .ig{background:linear-gradient(45deg,#F58529,#DD2A7B 55%,#8134AF);color:#fff}
#viewer .acts button{padding:11px 8px}
.igopts{display:grid;gap:10px;margin:6px 0 4px}
.igopts button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;font-size:15px;font-weight:700}
.igopts button small{display:block;font-weight:500;color:var(--sub);font-size:12px;margin-top:2px}
.igopts i{font-style:normal;width:38px;height:38px;flex:none;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;background:linear-gradient(45deg,#F58529,#DD2A7B 55%,#8134AF)}
#viewer .close{position:absolute;z-index:3;background:rgba(0,0,0,.45);border-radius:50%;top:10px;right:12px;color:#fff;font-size:28px;width:44px;height:44px}
#langBusy{position:fixed;inset:0;z-index:40;background:rgba(21,18,16,.45);display:flex;align-items:center;justify-content:center;padding:24px}
#langBusy .lbCard{position:relative;background:var(--card);border-radius:20px;padding:26px 22px 20px;width:100%;max-width:320px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 20px 50px -20px rgba(0,0,0,.5)}
#langBusy b{font-family:var(--serif);font-size:20px;font-weight:500}
#langBusy span{font-size:13px;color:var(--sub);line-height:1.5}#langBusy small{font-size:11.5px}
#langBusy .lbSpin{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--gold2);border-top-color:var(--gold);animation:lbr 0.9s linear infinite}
@keyframes lbr{to{transform:rotate(360deg)}}
#langBusy .lbTrack{width:100%;height:4px;border-radius:4px;background:#EFE7DB;overflow:hidden;margin-top:6px}#langBusy .lbTrack i{display:block;height:100%;background:var(--gold);transition:width .3s}
#langBusyX{position:absolute;top:8px;right:10px;font-size:16px;color:var(--sub);padding:6px}

.musBox{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.musBox .mrow{display:flex;align-items:center;gap:10px}
.musBox .mic2{width:38px;height:38px;flex:none;border-radius:50%;background:#F6EEE2;color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:18px}
.musBox .mname{flex:1;min-width:0;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.musBox .mname.none{color:var(--sub);font-weight:500}
.musBox .mbtn{flex:none;border:1px solid var(--gold);color:#7A5C2E;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700}
.musBox .mstart{margin-top:12px;font-size:12.5px;color:var(--sub);display:flex;align-items:center;gap:10px}
.musBox input[type=range]{flex:1;accent-color:var(--gold)}
.musBox .mplay{flex:none;width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px}
.musBox .msuno{display:block;width:100%;margin-top:12px;padding:10px;border-radius:12px;background:#151210;color:#F1E6D2;font-size:13.5px;font-weight:700;letter-spacing:.2px}
.musBox .mwarn{margin-top:8px;font-size:11.5px;color:var(--sub);line-height:1.4}
#askSheet{z-index:27}
.partHd{font-weight:800;font-size:14px;color:var(--gold);margin:6px 0 2px}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:30;display:none;max-width:88vw;text-align:center}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25;display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet .box{background:var(--bg);width:100%;max-width:620px;margin:0 auto;border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h2{margin-top:0}
.price{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.price>button{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;width:100%}
.price .pp{font-style:normal;float:right;font-weight:800;color:var(--acc)}
.price .badge{position:absolute;top:-9px;right:12px;background:var(--gold);color:#151210;font-style:normal;font-size:10.5px;font-weight:800;border-radius:6px;padding:2px 7px;letter-spacing:.5px}
.price .cur{border:2px solid var(--gold)}
.price b{font-size:18px}
.price .best{border:2px solid var(--acc)}
.ver{text-align:center;color:#B9ADA5;font-size:11px;margin-top:28px}
.field{margin-bottom:12px}.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:5px}
.field input{width:100%;font:inherit;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#colorNames{min-height:44px}
.mic{position:relative}.mic textarea{padding-right:58px}
.micBtn{position:absolute;right:8px;top:8px;width:42px;height:42px;border-radius:50%;background:var(--acc2);font-size:20px;line-height:42px;text-align:center}
.micBtn.on{background:var(--acc);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
.brand{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1;overflow:hidden}
header #langBtn{flex:none;width:96px;min-width:0;padding-left:10px;padding-right:22px;text-overflow:ellipsis}
#fontBtn{width:36px!important;height:36px!important;font-size:15px!important}
@media (max-width:380px){.brand b{font-size:17px!important;letter-spacing:2px!important}.brand small{font-size:7.5px!important;letter-spacing:2px!important}header{gap:7px!important;padding:12px 12px!important}}
.brand b{font-family:var(--serif);font-weight:600;font-size:21px;letter-spacing:4.5px}
.brand small{font-size:9px;letter-spacing:4px;color:var(--gold);margin-top:4px;font-weight:600}
header select{border:1px solid var(--line);background:transparent;font-size:13px;padding:6px 8px;border-radius:999px}
.hero{border:0;position:relative;border-radius:22px;overflow:hidden;background:#151210;color:#F7F3EE;min-height:300px;display:flex;flex-direction:column;justify-content:flex-end;padding:26px 22px 22px;text-align:left;width:100%;box-shadow:0 18px 40px -18px rgba(21,18,16,.55)}
.hero .bgimg{position:absolute;inset:0;background-size:cover;background-position:center 20%;opacity:.55;transform:scale(1.02)}
.hero::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(21,18,16,.05) 0%,rgba(21,18,16,.35) 45%,rgba(21,18,16,.92) 100%)}
.hero::after{content:'';position:absolute;inset:10px;border:1px solid rgba(233,220,196,.35);border-radius:16px;pointer-events:none}
.hero>*{position:relative}
.hero .kick{font-size:10px;letter-spacing:4px;color:var(--gold2);font-weight:600;margin-bottom:10px}
.hero h2{font-family:var(--serif);font-weight:500;font-size:28px;line-height:1.2;margin:0 0 10px;letter-spacing:.3px}
.hero p{margin:0 0 18px;font-size:13.5px;line-height:1.5;color:#D8CEC3;max-width:92%}
.hero .cta{align-self:flex-start;background:var(--gold);color:#151210;border-radius:999px;padding:12px 20px;font-weight:700;font-size:14px;letter-spacing:.3px}
.planbar{display:flex;align-items:center;gap:10px;margin:18px 2px 22px;font-size:12.5px;color:var(--sub)}
.planbar .dot{width:6px;height:6px;border-radius:50%;background:var(--gold)}
.planbar b{color:var(--ink)}
.planbar .go{margin-left:auto;white-space:nowrap;flex:none;font-size:12px;font-weight:700;color:var(--ink);border-bottom:1px solid var(--gold);padding:2px 0;letter-spacing:.5px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 12px}
.sec h3{font-family:var(--serif);font-weight:500;font-size:19px;margin:0;letter-spacing:.3px}
.sec span{font-size:10px;letter-spacing:3px;color:var(--gold);font-weight:600}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool{position:relative;overflow:hidden;text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:0;min-height:168px;padding:16px 15px 34px;border-radius:20px;
  background:linear-gradient(160deg,#FFFFFF 0%,#FBF8F3 100%);border:1px solid #ECE4D9;box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 10px 24px -18px rgba(60,40,20,.35);transition:transform .15s,box-shadow .15s}
.tool::before{content:'';position:absolute;left:15px;right:15px;bottom:0;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--gold),rgba(176,141,87,0));opacity:.55}
.tool .no{position:absolute;top:16px;right:15px;font-style:normal;font-family:var(--serif);font-size:11px;letter-spacing:2px;color:var(--gold);opacity:.9}
.tool .no::before{content:'';display:inline-block;width:14px;height:1px;background:var(--gold);opacity:.6;vertical-align:middle;margin-right:6px}
.tool svg{width:22px;height:22px;color:var(--gold);flex:none;box-sizing:content-box;padding:10px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#FFF8EC,#F3E8D6);border:1px solid #E9DCC4;margin-bottom:14px}
.tool b{font-size:15px;font-weight:700;letter-spacing:-.3px;line-height:1.3;margin-bottom:5px;word-break:keep-all}
.tool span{font-size:12px;color:var(--sub);line-height:1.45;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tool::after{content:'→';position:absolute;right:15px;bottom:12px;font-size:14px;color:var(--gold);opacity:.75}
.tool:active,.hero:active{transform:scale(.985)}
#gallery.grid{grid-template-columns:repeat(3,1fr);gap:6px}
#gallery .tile{border-radius:10px}
.empty{font-family:var(--serif);font-style:italic}
.ver{letter-spacing:2px}
#jobPill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));z-index:15;background:#151210;color:#F7F3EE;border:1px solid rgba(176,141,87,.6);border-radius:999px;padding:11px 18px;font-size:13.5px;font-weight:600;display:none;align-items:center;gap:8px;box-shadow:0 10px 28px -10px rgba(0,0,0,.5);white-space:nowrap}
#jobPill.on{display:flex}#jobPill.done{background:var(--gold);color:#151210}
#jobPill .spin{width:16px;height:16px;border-width:2px;margin:0}
.tile .newb{position:absolute;top:6px;left:6px;background:var(--gold);color:#151210;font-size:9.5px;font-weight:800;letter-spacing:1px;border-radius:6px;padding:2px 6px}
.tile .playb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6);pointer-events:none}
.tile video{width:100%;height:100%;object-fit:cover;display:block}
#qcLine{position:relative;z-index:2;margin:0 12px;padding:9px 12px;border-radius:12px;font-size:13px;line-height:1.45;color:#F7F3EE;background:#2A2522}
#qcLine.good{background:#1F3A2A}#qcLine.bad{background:#4A2323}#qcLine u{color:var(--gold2)}
.tile .qc.fixing{background:rgba(20,16,12,.78);color:#F3D99E;left:6px;right:6px;text-align:center}
.tile .qc{position:absolute;right:6px;bottom:6px;font-size:11px;font-weight:800;border-radius:7px;padding:2px 7px;color:#fff}
.tile .qc.good{background:rgba(31,110,60,.9)}.tile .qc.bad{background:rgba(155,44,44,.92)}
#vVid{max-width:100%;max-height:100%;border-radius:10px;background:#000}

let db=null;

const dbAll=s=>new Promise(res=>{if(!db)return res([]);const q=db.transaction(s).objectStore(s).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([]);});
const dbPut=(s,v)=>new Promise(res=>{if(!db)return res();const tx=db.transaction(s,'readwrite');tx.objectStore(s).put(v);tx.oncomplete=()=>res();tx.onerror=()=>res();});
const dbDel=(s,id)=>new Promise(res=>{if(!db)return res();const tx=db.transaction(s,'readwrite');tx.objectStore(s).delete(id);tx.oncomplete=()=>res();tx.onerror=()=>res();});

const FREE_TRIAL=5;      // 처음 무료로 만들 수 있는 장 수 (로고 들어감)
const DAILY_CAP=150;     // 하루 최대 (요금 폭탄 방지)
const ls=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:v;}catch(e){return d;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,String(v));}catch(e){}};
let BILL={ready:false,plan:'none',token:'',prices:{}};

const TEST_BUILD=(()=>{try{return !!(AB&&AB.isTestBuild&&AB.isTestBuild());}catch(e){return false;}})();
const PLAN_QUOTA={basic:100,pro:300};
const planNow=()=>BILL.plan!=='none'?BILL.plan:((TEST_BUILD||!AB)&&ls('premium','0')==='1'?'pro':'none');
const isPremium=()=>planNow()!=='none';
const monthKey=()=>'used-m-'+new Date().toISOString().slice(0,7);
const usedMonth=()=>+ls(monthKey(),0);
const monthLeft=()=>Math.max(0,(PLAN_QUOTA[planNow()]||0)-usedMonth());
// n장 만들 수 있는지 (안 되면 이유를 보여주고 false)
function canUse(n){
  if(TEST_BUILD&&ls('premium','0')==='1')return true; // 주야 님 테스트 앱은 장 수 제한 없이
  if(usedToday()+n>DAILY_CAP){toast(t('limit'));return false;}
  if(isPremium()){if(monthLeft()<n){toast(t('monthOver'));openPlan();return false;}return true;}
  if(trialLeft()<n){toast(t('trialOver'));openPlan();return false;}
  return true;}
window.__billingChanged=()=>{readBilling();renderPlan();if($('#planSheet').classList.contains('on'))fillPlan();};
const usedTotal=()=>+ls('used-total',0);
const dayKey=()=>'used-'+new Date().toISOString().slice(0,10);
const usedToday=()=>+ls(dayKey(),0);
const markUsed=()=>{lsSet('used-total',usedTotal()+1);lsSet(dayKey(),usedToday()+1);if(isPremium())lsSet(monthKey(),usedMonth()+1);};
const trialLeft=()=>Math.max(0,FREE_TRIAL-usedTotal());
function renderPlan(){
  const b=$('#planBox');
  if(isPremium()){b.innerHTML=`<i class="dot"></i><span>${t('planOn',t('plan_'+planNow()),monthLeft())}</span><button class="go" id="goPlan">${t('manage')}</button>`;$('#goPlan').onclick=openPlan;}
  else{const n=trialLeft();b.innerHTML=`<i class="dot"></i><span>${n>0?t('trialLeft',n):t('trialOver')}</span><button class="go" id="goPlan">${t('upgrade')}</button>`;$('#goPlan').onclick=openPlan;}
}
function fillPlan(){
  for(const k of ['basic_monthly','pro_monthly','pro_yearly']){const el=$('#pr_'+k);if(el)el.textContent=BILL.prices&&BILL.prices[k]?BILL.prices[k]:t({basic_monthly:'p1x',pro_monthly:'p2x',pro_yearly:'p3x'}[k]);}
  $$('.price>button').forEach(b=>b.classList.toggle('cur',(planNow()==='basic'&&b.dataset.buy==='basic_monthly')||(planNow()==='pro'&&b.dataset.buy!=='basic_monthly')));
  const trial=BILL.prices&&(BILL.prices.basic_monthly_trial||BILL.prices.pro_monthly_trial);
  $('#planNote').textContent=!AB?t('soon'):!BILL.ready?t('payNotReady'):(trial?t('trialNote'):t('cancelAnytime'));
  $('#testSw').hidden=!(TEST_BUILD||!AB);$('#testChk').checked=ls('premium','0')==='1';}

  if(AB&&AB.pickPhoto){const id=uid();photoWait[id]=res;AB.pickPhoto(id);return;}
  fileResolve=res;$('#fileIn').click();});
const loadImg=src=>new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=src;});
async function shrink(url,max=1280,q=0.9){
  const im=await loadImg(url);if(!im)return null;
  const sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');
  c.width=Math.round(im.naturalWidth*sc);c.height=Math.round(im.naturalHeight*sc);const g=c.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q);
}
window.__photos=(id,arr,err)=>{const r=photoWait[id];delete photoWait[id];if(!r)return;if(err&&err!=='cancel')toast(t('readFail')+' ['+err.slice(0,40)+']');r(arr||[]);};
let manyResolve=null;
$('#fileMany').onchange=async e=>{const fs=[...(e.target.files||[])];e.target.value='';const r=manyResolve;manyResolve=null;
  const out=await Promise.all(fs.map(f=>new Promise(res=>{const rd=new FileReader();rd.onload=()=>res(rd.result);rd.onerror=()=>res(null);rd.readAsDataURL(f);})));r&&r(out.filter(Boolean));};
const pickImages=max=>new Promise(res=>{

  manyResolve=res;$('#fileMany').click();});
async function addPhoto(kind){
  const room=clothMax()-S.clothes.length;
  if(kind==='cloth'&&room>1){
    const list=(await pickImages(room)).slice(0,room);let bad=0;
    for(const raw of list){const u=await shrink(raw);if(u&&S.clothes.length<clothMax())S.clothes.push(u);else bad++;}
    if(bad)toast(t('readFail'));
    renderSlots();renderGo();return;
  }
  const raw=await pickImage();if(!raw)return;const u=await shrink(raw);if(!u){toast(t('readFail')+' ['+String(raw).slice(5,25)+']');return;}
  if(kind==='person')S.person=u;else if(kind==='back')S.back=u;else if(S.clothes.length<clothMax())S.clothes.push(u);
  renderSlots();renderGo();
}

function slotEl(img,onAdd,onDel,big){
  const b=document.createElement('button');b.className='slot'+(img?' filled':'')+(big?' big':'');
  if(img){b.innerHTML=`<img src="${img}" alt=""><span class="x">✕</span>`;b.querySelector('.x').onclick=e=>{e.stopPropagation();onDel();};}
  else{b.innerHTML=`<span class="plus">＋</span><span>${t('addPhoto')}</span>`;b.onclick=onAdd;}
  return b;
}
function renderSlots(){
  const ps=$('#personSlots');ps.innerHTML='';
  ps.append(slotEl(S.person,()=>addPhoto('person'),()=>{S.person=null;renderSlots();renderGo();},true));
  const bs=$('#backSlots');bs.innerHTML='';
  bs.append(slotEl(S.back,()=>addPhoto('back'),()=>{S.back=null;renderSlots();}));
  const cs=$('#clothSlots');cs.innerHTML='';
  S.clothes.forEach((c,i)=>cs.append(slotEl(c,null,()=>{S.clothes.splice(i,1);renderSlots();renderGo();})));
  if(S.clothes.length<clothMax())cs.append(slotEl(null,()=>addPhoto('cloth')));
  $('#clothMax').textContent=t('upToN',clothMax());
}
function chips(el,list,isOn,onTap,ck){
  el.innerHTML='';for(const o of list){const b=document.createElement('button');b.className='chip'+(isOn(o.id)?' on':'')+(o.custom?' cust':'');b.textContent=nm(o);b.onclick=()=>{onTap(o.id);};
    if(o.custom&&ck){const x=document.createElement('span');x.className='cx';x.textContent='✕';
      x.onclick=e=>{e.stopPropagation();ask(t('custDel')+'\n\n"'+nm(o)+'"',null,()=>{CUST[ck]=(CUST[ck]||[]).filter(c=>c.id!==o.id);custSave();
        if(S[ck]===o.id)S[ck]=OPT[ck][0].id;if(ck==='pose'){S.poses=S.poses.filter(p=>p!==o.id);if(!S.poses.length)S.poses=['front'];}
        onTap(null);});};b.append(x);}
    el.append(b);}
  if(ck){const a=document.createElement('button');a.className='chip add';a.textContent='＋ '+t('custAdd');a.onclick=()=>addCustom(ck,id=>onTap(id));el.append(a);}
}

let aiCfg=null;try{aiCfg=AB&&AB.aiConfig?JSON.parse(AB.aiConfig()):null;}catch(e){aiCfg=null;}
const srvH=()=>({'content-type':'application/json','x-app-key':aiCfg.key,'x-device':aiCfg.device,'x-plan-token':BILL.token||''});
const aiReady=()=>!!(aiCfg&&((aiCfg.url&&aiCfg.key)||aiCfg.gemini));
// 좋은 순서대로 시도: 표준 → 고급(Pro) → 가벼운 모델
const MODELS=['gemini-3.1-flash-image','gemini-3-pro-image','gemini-3.1-flash-lite-image'];
async function callGemini(job,signal){
  const parts=[{text:job.prompt},...job.imgs.map(i=>({inline_data:{mime_type:i.mime,data:i.data}}))];
  let last='';
  for(const model of MODELS){
    let r,d;
    try{r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,{method:'POST',signal,
      headers:{'content-type':'application/json','x-goog-api-key':aiCfg.gemini},
      body:JSON.stringify({contents:[{role:'user',parts}],generationConfig:{responseModalities:['IMAGE'],imageConfig:{aspectRatio:S.ratio,imageSize:'1K'}}})});
      d=await r.json().catch(()=>({}));}catch(e){if(e.name==='AbortError')throw e;last=String(e.message||e);continue;}
    if(r.status===429)return {status:429,message:(d.error&&d.error.message)||'429'};
    if(!r.ok){last=(d.error&&d.error.message)||('http '+r.status);continue;}
    const out=((d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts)||[]).find(x=>x.inlineData||x.inline_data);
    const img=out&&(out.inlineData||out.inline_data);
    if(img&&img.data)return {status:200,image:img.data,mime:img.mimeType||img.mime_type||'image/png'};
    last=(d.candidates&&d.candidates[0]&&d.candidates[0].finishReason)||(d.promptFeedback&&d.promptFeedback.blockReason)||'no image';
  }
  return {status:502,message:last};
}
async function callServer(job,signal){
  const r=await fetch(aiCfg.url.replace(/\/$/,'')+'/generate',{method:'POST',signal,headers:srvH(),
    body:JSON.stringify({prompt:job.prompt,images:job.imgs,ratio:S.ratio})});
  const d=await r.json().catch(()=>({}));
  if(r.status===429)return {status:429};
  if(r.status===402)throw Object.assign(new Error(t(d.error==='month_over'?'monthOver':'trialOver')),{detail:d.message});
  if(!r.ok||!d.image)return {status:502,message:d.message||d.error||('http '+r.status)};
  return {status:200,image:d.image,mime:d.mime||'image/png'};
}
async function generate(job){
  const server=!!(aiCfg.url&&aiCfg.key);
  let lastMsg='';
  for(let a=0;a<3;a++){
    const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),120000);
    try{
      const d=server?await callServer(job,ctl.signal):await callGemini(job,ctl.signal);
      if(d.status===429){lastMsg=d.message||'429';if(/billing|quota|free_tier|limit: 0/i.test(lastMsg))break;await sleep(12000);continue;}
      if(d.status===200)return `data:${d.mime};base64,${d.image}`;
      lastMsg=d.message||'';if(/prohibit|safety|SAFETY|block|policy/i.test(lastMsg))break;if(a<1){await sleep(2000);continue;}
      break;
    }catch(e){if(e.name==='AbortError')throw new Error(t('slow'));if(e instanceof TypeError)throw new Error(t('net'));throw e;}
    finally{clearTimeout(to);}
  }
  const why=/prepay|credits are depleted|credit balance/i.test(lastMsg)?'noCredit':/billing|quota|free_tier|limit: 0|429|RESOURCE_EXHAUSTED/i.test(lastMsg)?'needBilling':/api key|API_KEY|permission|401|403|unauth/i.test(lastMsg)?'badKey':/safety|SAFETY|PROHIBITED|prohibited|block|policy/i.test(lastMsg)?'blocked':'failed';
  const e=new Error(t(why));e.detail=lastMsg;throw e;
}

async function stamp(url){
  if(isPremium())return url;
  const im=await loadImg(url);if(!im)return url;
  const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;const g=c.getContext('2d');g.drawImage(im,0,0);
  const fs=Math.round(c.width*0.035);g.font=`700 ${fs}px system-ui,sans-serif`;g.textAlign='right';g.textBaseline='bottom';
  const txt='Click.moda AI';const pad=Math.round(fs*0.7);
  g.fillStyle='rgba(0,0,0,.28)';g.fillText(txt,c.width-pad+2,c.height-pad+2);g.fillStyle='rgba(255,255,255,.85)';g.fillText(txt,c.width-pad,c.height-pad);
  return c.toDataURL('image/jpeg',0.93);
}

function jobBegin(n,label){

  JOB.run++;JOB.total+=n;clearTimeout(JOB.timer);
  try{AB&&AB.workStart&&AB.workStart(label||t('jobRun',JOB.done,JOB.total));}catch(e){}
  jobPill();}
function jobStep(ok){JOB.done++;if(ok)JOB.made++;try{AB&&AB.workUpdate&&AB.workUpdate(t('jobRun',JOB.done,JOB.total));}catch(e){}jobPill();}
function jobEnd(){
  JOB.run=Math.max(0,JOB.run-1);if(JOB.run)return jobPill();
  try{AB&&AB.workStop&&AB.workStop();}catch(e){}
  if(JOB.made){if(document.hidden){try{AB&&AB.notifyDone&&AB.notifyDone(t('doneTitle'),t('doneText',JOB.made));}catch(e){}}

async function runJobs(jobs,mode,modelName,onDone){
  lastJob={jobs,mode,modelName};$('#modelBtn').hidden=!((mode==='dress'||mode==='batch')&&S.clothes.length);
  show('result');
  const grid=$('#resultGrid');grid.innerHTML='';grid.style.setProperty('--ar',S.ratio.replace(':','/'));
  const tiles=jobs.map(j=>{const d=document.createElement('div');d.className='tile';d.style.aspectRatio=S.ratio.replace(':','/');d.innerHTML=`<div><div class="spin"></div>${t('working')}</div><span class="lab">${j.label}</span>`;grid.append(d);return d;});

  const saved=models.find(m=>m.id===S.modelId);
  let ref=(saved&&(mode==='dress'||mode==='batch'))?{mime:'image/jpeg',data:saved.img.split(',')[1]}:null;
  const good=[];
  jobBegin(jobs.length);
  const runOne=async i=>{
    const tile=tiles[i];
    const job=jobs[i];
    if(job.kind==='dress'){job.prompt=dressPrompt(job,ref,job.ex);job.imgs=[...job.garments,...(job.back?[job.back]:[]),...(ref?[ref]:[])];}
    let ok=false;
    try{
      const raw=await generate(job);markUsed();ok=true;
      if(job.kind==='dress'&&!ref){const m=raw.match(/^data:([^;]+);base64,(.*)$/);if(m)ref={mime:m[1],data:m[2]};}
      const img=await stamp(raw);
      const rec={id:uid(),ts:Date.now()+i,mode,img,isNew:true};
      if(mode==='model'){await saveModel(raw,modelName);}
      await dbPut('photos',rec);
      good.push(img);if(onDone)await onDone(img);
      tile.innerHTML=`<img src="${img}" alt=""><span class="lab">${jobs[i].label}</span>`;tile.onclick=()=>openViewer(rec);
      if(job.garments&&job.garments.length&&!job.color)qualityCheck(rec,job.garments,job.back,tile);
    }catch(e){
      tile.className='tile err';tile.innerHTML=`<div>⚠️ ${e.message}${e.detail?`<br><small style="opacity:.7">${String(e.detail).slice(0,120)}</small>`:''}${e.message===t('blocked')?`<br><span class="why">${t('whyBlocked')}</span>`:''}</div>`;
    }
    jobStep(ok);
  };
  // 같은 모델을 맞춰야 하면 첫 장만 먼저, 나머지는 3장씩 동시에
  let next=0;
  if(jobs.length>1&&jobs[0].kind==='dress'&&!ref){await runOne(0);next=1;}
  await Promise.all(Array.from({length:Math.min(3,jobs.length-next)},async()=>{while(next<jobs.length){const i=next++;await runOne(i);}}));
  $('#againBtn').disabled=false;
  lastGood=good;lastResultView='result';
  jobEnd();
}

function videoPrompt(){
  return `Animate this fashion photo into a short, realistic fashion video for an online clothing store. Motion: ${pick('vmove',S.vmove).p}. Camera: ${pick('vcam',S.vcam).p}. Keep the same model (face, hair, skin, body) and keep every garment exactly as in the photo: same colors, fabric, print, details and fit; the clothes must not change, morph or gain new elements. Anatomically correct, natural human movement filmed like a real fashion video: the body always moves as one connected unit; when she turns, her feet step and her legs, hips, torso and head rotate together; NEVER twist the upper body independently from the legs, never rotate the waist or neck unnaturally, no extra or missing limbs, no morphing or melting body parts. Keep the same face, hair, shoes and accessories from the first to the last frame (do not remove shoes, do not change the person). Smooth, realistic fabric physics, professional lighting. ${pick('vsound',S.vsound).p} No text, captions, logos or watermarks.${reqPrompt()}`;
}
function findVideo(o,depth=0){
  if(!o||typeof o!=='object'||depth>12)return null;
  const mt=o.mime_type||o.mimeType||'';
  if((o.type==='video'||mt.startsWith('video'))&&(o.data||o.uri))return {data:o.data,uri:o.uri,mime:mt||'video/mp4'};
  for(const k in o){const r=findVideo(o[k],depth+1);if(r)return r;}
  return null;}
const blobToDataURL=b=>new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>res(null);r.readAsDataURL(b);});
async function callVideo(img){
  const data=img.split(',')[1],prompt=videoPrompt();
  if(aiCfg.url&&aiCfg.key){
    const r=await fetch(aiCfg.url.replace(/\/$/,'')+'/video',{method:'POST',headers:srvH(),body:JSON.stringify({image:data,prompt,aspect_ratio:S.vfmt,resolution:S.vres})});
    const d=await r.json().catch(()=>({}));if(r.status===402)throw Object.assign(new Error(t(d.error==='month_over'?'monthOver':'trialOver')),{detail:d.message});if(!r.ok||!d.video)throw Object.assign(new Error(t(r.status===429?'needBilling':'failed')),{detail:d.message||d.error||r.status});
    return `data:${d.mime||'video/mp4'};base64,${d.video}`;}
  const base='https://generativelanguage.googleapis.com/v1beta';const H={'content-type':'application/json','x-goog-api-key':aiCfg.gemini};
  const r=await fetch(base+'/interactions',{method:'POST',headers:H,body:JSON.stringify({model:'gemini-omni-1.1-flash',
    input:[{type:'image',data,mime_type:'image/jpeg'},{type:'text',text:prompt}],
    generation_config:{video_config:{task:'image_to_video'}},response_format:{type:'video',aspect_ratio:S.vfmt,resolution:S.vres}})});
  let d=await r.json().catch(()=>({}));
  if(!r.ok){const m=(d.error&&d.error.message)||('http '+r.status);const why=/prepay|credits are depleted|credit balance/i.test(m)?'noCredit':/billing|quota|429|RESOURCE_EXHAUSTED/i.test(m)?'needBilling':/safety|block|policy|prohibited/i.test(m)?'blocked':'failed';throw Object.assign(new Error(t(why)),{detail:m});}
  let v=findVideo(d);
  // 아직 안 끝났으면 기다리며 확인 (최대 8분)
  for(let k=0;!v&&d&&d.id&&k<80;k++){await sleep(6000);
    const q=await fetch(`${base}/interactions/${encodeURIComponent(d.id)}`,{headers:H});d=await q.json().catch(()=>({}));
    if(d&&(d.status==='failed'||d.error))throw Object.assign(new Error(t('failed')),{detail:(d.error&&d.error.message)||d.status});
    v=findVideo(d);}
  if(!v)throw Object.assign(new Error(t('failed')),{detail:'no video'});
  if(v.data)return `data:${v.mime};base64,${v.data}`;
  const m=String(v.uri).match(/files\/([^/?:]+)/);
  if(m)for(let k=0;k<60;k++){const f=await (await fetch(`${base}/files/${m[1]}`,{headers:H})).json().catch(()=>({}));if(f.state==='ACTIVE')break;if(f.state==='FAILED')throw new Error(t('failed'));await sleep(5000);}
  const dl=await fetch(m?`${base}/files/${m[1]}:download?alt=media`:v.uri,{headers:{'x-goog-api-key':aiCfg.gemini}});
  if(!dl.ok)throw Object.assign(new Error(t('failed')),{detail:'download '+dl.status});
  return await blobToDataURL(await dl.blob());
}

/* AI 품질 검사: 원래 옷 사진과 결과를 비교 → 덜 닮았으면 자동으로 한 번 다듬음 (사용 장 수에서 안 빠짐) */
async function qcScore(img,garments,back){
  const res=await asJpeg(img);const small=await shrink(res,1024,0.85);
  const imgs=[...garments,...(back?[back]:[]),{mime:'image/jpeg',data:small.split(',')[1]}];
  const q=await callText(`You are a strict quality inspector for a clothing e-commerce store. The first ${garments.length} image(s) are the ORIGINAL garment photos${back?' and the next image is the back of the garment':''}. The LAST image is an AI-generated photo of a model wearing it. Compare ONLY the garment(s): color, fabric look, print/pattern, neckline/collar, sleeves, length, fit/cut, buttons/zippers/closures, pockets, embroidery and any text or logo. Ignore the model, pose, hair, shoes, accessories and background. Give a score from 0 to 100 for how faithfully the garment was reproduced. List at most 3 concrete differences, each as a short instruction that would fix it (e.g. "make the collar round like the original"), written in ${langEn()}. Return JSON: {"score": number, "issues": [string]}`,imgs,true);
  return {score:Math.max(0,Math.min(100,Math.round(+q.score||0))),issues:(q.issues||[]).slice(0,3).map(String)};
}
async function qualityCheck(rec,garments,back,tile){
  try{
    rec.qc=await qcScore(rec.img,garments,back);await dbPut('photos',rec);
    if(rec.qc.score<80&&rec.qc.issues.length&&!rec.autoFixed){
      rec.autoFixed=true;rec.fixing=true;await dbPut('photos',rec);
      const lab=tile&&tile.isConnected?document.createElement('span'):null;if(lab){lab.className='qc fixing';lab.textContent='✨ '+t('qcFixing');tile.append(lab);}
      try{
        const cur=await asJpeg(rec.img);
        const raw=await generate({prompt:`The first ${garments.length} image(s) are the ORIGINAL garment photos${back?' and the next image is the back of the garment':''}. The LAST image is a photo of a model wearing that garment, but the garment is not reproduced exactly. Edit the LAST image so the garment matches the original photos exactly in color, fabric, print, neckline, sleeves, length, cut and every detail. Fix especially: ${rec.qc.issues.join('; ')}. Keep the same person, face, hair, pose, shoes, accessories, background, lighting and framing as the LAST image. Photorealistic. No text, no logo, no watermark.`,
          imgs:[...garments,...(back?[back]:[]),{mime:'image/jpeg',data:cur.split(',')[1]}]});
        const img=await stamp(raw);const q2=await qcScore(img,garments,back);
        if(q2.score>=rec.qc.score){rec.img=img;rec.qc=q2;if(tile&&tile.isConnected){const im=tile.querySelector('img');if(im)im.src=img;}}
      }catch(e){}
      rec.fixing=false;await dbPut('photos',rec);if(lab)lab.remove();
      if(cur==='home')renderGallery();
    }
    if(viewing&&viewing.id===rec.id){viewing=rec;$('#vImg').src=rec.img;showQC(rec);}
  }catch(e){}
}

function zClamp(){const im=$('#vImg'),w=im.clientWidth,h=im.clientHeight;

  Z.x=Math.min(0,Math.max(w-w*Z.s,Z.x));Z.y=Math.min(0,Math.max(h-h*Z.s,Z.y));}

  // 화면의 (cx,cy) 지점을 고정한 채 배율 변경
  const lx=(cx-(im.left-Z.x))-Z.x,ly=(cy-(im.top-Z.y))-Z.y; // 이미지 기준 좌표(현재 배율)
  const k=ns/Z.s;Z.x=Z.x-(lx*(k-1));Z.y=Z.y-(ly*(k-1));Z.s=ns;}

const vb=$('#vBox');

  else if(e.touches.length===1){const now=Date.now();const t0=e.touches[0];
    if(now-zLastTap<300){if(Z.s>1)zReset();else{zZoomAt(t0.clientX,t0.clientY,2.5);zClamp();zApply();}zLastTap=0;zTouches=null;return;}
    zLastTap=now;zTouches={px:t0.clientX,py:t0.clientY,x:Z.x,y:Z.y};}
},{passive:true});
vb.addEventListener('touchmove',e=>{
  if(!zTouches)return;e.preventDefault();
  if(e.touches.length===2&&zTouches.d){const ns=Math.min(6,Math.max(1,zTouches.s*dist(e.touches[0],e.touches[1])/zTouches.d));
    const cx=(e.touches[0].clientX+e.touches[1].clientX)/2,cy=(e.touches[0].clientY+e.touches[1].clientY)/2;zZoomAt(cx,cy,ns);zClamp();zApply();}
  else if(e.touches.length===1&&zTouches.px!==undefined&&Z.s>1){Z.x=zTouches.x+(e.touches[0].clientX-zTouches.px);Z.y=zTouches.y+(e.touches[0].clientY-zTouches.py);zClamp();zApply();}
},{passive:false});

vb.addEventListener('dblclick',e=>{if(Z.s>1)zReset();else{zZoomAt(e.clientX,e.clientY,2.5);zClamp();zApply();}});

function coverDraw(g,im,x,y,w,h){const r=Math.max(w/im.naturalWidth,h/im.naturalHeight);const sw=w/r,sh=h/r;g.drawImage(im,(im.naturalWidth-sw)/2,(im.naturalHeight-sh)*0.35,sw,sh,x,y,w,h);}
function fmtPrice(v){v=String(v||'').replace(/[^\d.,]/g,'');if(!v)return '';let n=v.includes(',')?v.replace(/\./g,'').replace(',','.'):v;n=parseFloat(n);if(isNaN(n))return '';return 'R$ '+n.toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
function containDraw(g,im,x,y,w,h){
  g.save();g.beginPath();g.rect(x,y,w,h);g.clip();
  // 뒤: 같은 사진을 흐리게 꽉 채움 / 앞: 사진 전체(머리~발)가 다 보이게
  try{g.filter='blur(28px) brightness(1.05)';}catch(e){}
  coverDraw(g,im,x-30,y-30,w+60,h+60);try{g.filter='none';}catch(e){}
  g.fillStyle='rgba(255,255,255,.25)';g.fillRect(x,y,w,h);
  const r=Math.min(w/im.naturalWidth,h/im.naturalHeight);const dw=im.naturalWidth*r,dh=im.naturalHeight*r;
  g.drawImage(im,x+(w-dw)/2,y+(h-dh)/2,dw,dh);g.restore();
}
async function makeCatalog(){

  lsSet('cat-shop',info.shop);lsSet('cat-phone',info.phone);lsSet('cat-min',info.min);lsSet('cat-sizes',JSON.stringify(catSizes));lsSet('cat-sizes2',JSON.stringify(catSizes2));
  const url=await renderCatalog(catImgs,info);if(!url)return;

  if(catEditRec){rec=catEditRec;rec.img=url;rec.info=info;rec.ts=Date.now();catEditRec=null;} // 같은 카탈로그를 고쳐서 바꿈
  else rec={id:uid(),ts:Date.now(),mode:'catalog',img:url,src:[...catImgs],info};
  await dbPut('photos',rec);renderGallery&&renderGallery();
  $('#catSheet').classList.remove('on');closeViewer();toast(t('catDone'));openViewer(rec);
}
async function renderCatalog(srcs,info){
  if(info.two)return renderCatalog2(srcs,info);
  const {shop,phone,min,name,price}=info;const catSizes=info.sizes||[];
  const ims=(await Promise.all(srcs.map(loadImg))).filter(Boolean);if(!ims.length)return null;
  const W=1080,H=1350,P=330,PH=H-P;const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,W,H);
  const n=ims.length,gap=6;
  if(n===1)containDraw(g,ims[0],0,0,W,PH);
  else if(n<=3){const w=(W-gap*(n-1))/n;ims.forEach((im,i)=>containDraw(g,im,i*(w+gap),0,w,PH));}
  else{const w=(W-gap)/2,h=(PH-gap)/2;ims.forEach((im,i)=>containDraw(g,im,(i%2)*(w+gap),Math.floor(i/2)*(h+gap),w,h));}
  const F='system-ui,-apple-system,Roboto,sans-serif';
  // 아래 정보
  g.fillStyle='#B4536A';g.fillRect(0,PH,W,8);
  g.textAlign='left';g.textBaseline='alphabetic';g.fillStyle='#1F1A17';
  let nameFs=56;g.font=`800 ${nameFs}px ${F}`;const nameMax=price?W-140-g.measureText(price).width-60:W-100;
  let nm2=name||'Novidade';while(g.measureText(nm2).width>nameMax&&nameFs>34){nameFs-=4;g.font=`800 ${nameFs}px ${F}`;}
  g.fillText(nm2,50,PH+92);
  if(price){g.font=`800 64px ${F}`;g.textAlign='right';g.fillStyle='#B4536A';g.fillText(price,W-50,PH+96);g.textAlign='left';}
  // 사이즈 칸
  let x=50;const y=PH+130;g.font=`700 30px ${F}`;g.fillStyle='#7A6F68';g.fillText('Tamanhos',x,y+40);x+=g.measureText('Tamanhos').width+22;
  for(const z of catSizes){const lab=z==='U'?'Único':z;g.font=`800 30px ${F}`;const w=Math.max(64,g.measureText(lab).width+30);
    g.strokeStyle='#1F1A17';g.lineWidth=3;g.beginPath();g.roundRect?g.roundRect(x,y,w,58,12):g.rect(x,y,w,58);g.stroke();
    g.fillStyle='#1F1A17';g.textAlign='center';g.fillText(lab,x+w/2,y+40);g.textAlign='left';x+=w+12;}
  // ATACADO 띠: 사진 위가 아니라 아래 흰 칸 오른쪽에 (사진을 가리지 않게)
  {const bw=230,bh=58,bx=W-50-bw;const by=(x<=bx-20)?y:PH+205;
   g.fillStyle='#B4536A';g.beginPath();g.roundRect?g.roundRect(bx,by,bw,bh,29):g.rect(bx,by,bw,bh);g.fill();
   g.fillStyle='#fff';g.font=`800 30px ${F}`;g.textBaseline='middle';g.textAlign='center';g.fillText('ATACADO',bx+bw/2,by+bh/2+1);
   g.textBaseline='alphabetic';g.textAlign='left';}
  // 최소 주문
  g.font=`700 32px ${F}`;g.fillStyle='#1F1A17';
  const line=[min?`Pedido mínimo: ${min} peças`:'',n>1?`${n} opções`:''].filter(Boolean).join('   •   ');
  if(line)g.fillText(line,50,PH+248);
  // 가게·전화
  g.font=`600 28px ${F}`;g.fillStyle='#7A6F68';const foot=[shop,phone?'WhatsApp '+phone:''].filter(Boolean).join('   •   ');
  if(foot)g.fillText(foot,50,PH+300);
  return c.toDataURL('image/jpeg',0.92);
}
/* 상의 + 하의를 따로 (이름·가격·사이즈 각각) */
async function renderCatalog2(srcs,info){

  g.fillStyle='#fff';g.fillRect(0,0,W,H);

  if(n===1)containDraw(g,ims[0],0,0,W,PH);
  else if(n<=3){const w=(W-gap*(n-1))/n;ims.forEach((im,i)=>containDraw(g,im,i*(w+gap),0,w,PH));}
  else{const w=(W-gap)/2,h=(PH-gap)/2;ims.forEach((im,i)=>containDraw(g,im,(i%2)*(w+gap),Math.floor(i/2)*(h+gap),w,h));}
  const F='system-ui,-apple-system,Roboto,sans-serif';
  g.fillStyle='#B4536A';g.fillRect(0,PH,W,8);
  const rows=[{tag:'Blusa',name:info.name,price:info.price,sizes:info.sizes||[]},{tag:'Calça',name:info.name2,price:info.price2,sizes:info.sizes2||[]}];
  rows.forEach((r,i)=>{
    const y0=PH+28+i*138;
    // 이름 + 가격
    g.textAlign='left';g.textBaseline='alphabetic';g.fillStyle='#1F1A17';
    let fs=44;g.font=`800 ${fs}px ${F}`;const pw=r.price?(g.font=`800 50px ${F}`,g.measureText(r.price).width):0;g.font=`800 ${fs}px ${F}`;
    let nm=r.name||r.tag;const max=W-100-pw-40;while(g.measureText(nm).width>max&&fs>28){fs-=3;g.font=`800 ${fs}px ${F}`;}
    g.fillText(nm,50,y0+46);
    if(r.price){g.font=`800 50px ${F}`;g.textAlign='right';g.fillStyle='#B4536A';g.fillText(r.price,W-50,y0+48);g.textAlign='left';}
    // 사이즈
    let x=50;const y=y0+66;
    for(const z of r.sizes){const lab=z==='U'?'Único':z;g.font=`800 26px ${F}`;const w=Math.max(56,g.measureText(lab).width+26);
      g.strokeStyle='#1F1A17';g.lineWidth=2.5;g.beginPath();g.roundRect?g.roundRect(x,y,w,48,10):g.rect(x,y,w,48);g.stroke();
      g.fillStyle='#1F1A17';g.textAlign='center';g.fillText(lab,x+w/2,y+34);g.textAlign='left';x+=w+10;}
    if(i===0){g.strokeStyle='#E8E1DA';g.lineWidth=2;g.beginPath();g.moveTo(50,y0+132);g.lineTo(W-50,y0+132);g.stroke();}
  });
  // 세트 가격 + ATACADO
  const yb=PH+318;
  {const bw=230,bh=58,bx=W-50-bw;g.fillStyle='#B4536A';g.beginPath();g.roundRect?g.roundRect(bx,yb,bw,bh,29):g.rect(bx,yb,bw,bh);g.fill();
   g.fillStyle='#fff';g.font=`800 30px ${F}`;g.textBaseline='middle';g.textAlign='center';g.fillText('ATACADO',bx+bw/2,yb+bh/2+1);g.textBaseline='alphabetic';g.textAlign='left';}
  if(info.setPrice){g.font=`800 38px ${F}`;g.fillStyle='#1F1A17';g.fillText('Conjunto ',50,yb+42);const w=g.measureText('Conjunto ').width;g.fillStyle='#B4536A';g.fillText(info.setPrice,50+w,yb+42);}
  g.font=`700 30px ${F}`;g.fillStyle='#1F1A17';
  const line=[info.min?`Pedido mínimo: ${info.min} peças`:'',n>1?`${n} opções`:''].filter(Boolean).join('   •   ');

  return c.toDataURL('image/jpeg',0.92);
}

/* 사진 한 장을 AI로 고치기 (카탈로그면 모델 사진만 고치고 카탈로그를 다시 그림) */
async function editPhoto(rec,prompt,label){
  const cat=(rec.mode==='catalog'&&rec.src&&rec.src.length)?rec:null;
  const src=await asJpeg(cat?cat.src[0]:rec.img);
  closeViewer();
  const im=await loadImg(src);const r=im?im.naturalWidth/im.naturalHeight:0.75;
  const near=[['3:4',3/4],['4:5',4/5],['9:16',9/16],['1:1',1]].sort((a,b)=>Math.abs(a[1]-r)-Math.abs(b[1]-r))[0][0];
  const prev=S.ratio;S.ratio=near;
  const onDone=cat?async img=>{const ns=[img,...cat.src.slice(1)];const url=await renderCatalog(ns,cat.info);if(!url)return;
    const rec={id:uid(),ts:Date.now(),mode:'catalog',img:url,src:ns,info:cat.info};await dbPut('photos',rec);toast(t('catDone'));openViewer(rec);}:null;
  await runJobs([{label,prompt,imgs:[{mime:'image/jpeg',data:src.split(',')[1]}]}],'edit','',onDone);
  S.ratio=prev;
}

// JPEG 페이지들로 PDF 파일 만들기
function makePdf(pages){ // pages: [{jpeg:Uint8Array,w,h}]
  const enc=new TextEncoder();const chunks=[];let len=0;const offs=[];
  const put=x=>{const b=typeof x==='string'?enc.encode(x):x;chunks.push(b);len+=b.length;};
  const obj=(n,body)=>{offs[n]=len;put(`${n} 0 obj\n`);for(const b of [].concat(body))put(b);put('\nendobj\n');};
  put('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  const N=pages.length,PW=595.28,PH=841.89;const kids=pages.map((_,i)=>`${3+i*3} 0 R`).join(' ');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,`<< /Type /Pages /Kids [${kids}] /Count ${N} >>`);
  pages.forEach((pg,i)=>{const po=3+i*3,io=po+1,co=po+2;const cs=`q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
    obj(po,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 ${io} 0 R >> >> /Contents ${co} 0 R >>`);
    obj(io,[`<< /Type /XObject /Subtype /Image /Width ${pg.w} /Height ${pg.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${pg.jpeg.length} >>\nstream\n`,pg.jpeg,'\nendstream']);
    obj(co,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);});
  const total=3+N*3,xref=len;let x=`xref\n0 ${total}\n0000000000 65535 f \n`;for(let i=1;i<total;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  put(x);put(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  const out=new Uint8Array(len);let o=0;for(const c of chunks){out.set(c,o);o+=c.length;}return out;}
const dataUrlBytes=u=>{const b=atob(u.split(',')[1]);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;};
const bytesB64=a=>{let s='';for(let i=0;i<a.length;i+=32768)s+=String.fromCharCode.apply(null,a.subarray(i,i+32768));return btoa(s);};

function reelMusic(ac,dest,dur){ // 부드러운 패션 배경음 (직접 만든 소리, 저작권 걱정 없음)
  const master=ac.createGain();master.gain.value=0.0001;master.connect(dest);
  const t0=ac.currentTime+0.05;master.gain.exponentialRampToValueAtTime(0.5,t0+1);master.gain.setValueAtTime(0.5,t0+dur-1.2);master.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  const bpm=104,beat=60/bpm,chords=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]],hz=m=>440*Math.pow(2,(m-69)/12);
  const note=(f,st,len,type,vol)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0.0001,st);g.gain.exponentialRampToValueAtTime(vol,st+0.04);g.gain.exponentialRampToValueAtTime(0.0001,st+len);o.connect(g);g.connect(master);o.start(st);o.stop(st+len+0.05);};
  const noise=ac.createBuffer(1,ac.sampleRate*0.05,ac.sampleRate);const nd=noise.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=(Math.random()*2-1)*(1-i/nd.length);
  for(let b=0,tt=t0;tt<t0+dur;b++,tt+=beat){const ch=chords[Math.floor(b/8)%4];
    if(b%8===0)ch.forEach(m=>note(hz(m),tt,beat*8,'triangle',0.06));
    if(b%2===0){const k=ac.createOscillator(),kg=ac.createGain();k.frequency.setValueAtTime(110,tt);k.frequency.exponentialRampToValueAtTime(45,tt+0.15);kg.gain.setValueAtTime(0.5,tt);kg.gain.exponentialRampToValueAtTime(0.0001,tt+0.18);k.connect(kg);kg.connect(master);k.start(tt);k.stop(tt+0.2);}
    const h=ac.createBufferSource(),hg=ac.createGain(),hf=ac.createBiquadFilter();hf.type='highpass';hf.frequency.value=7000;h.buffer=noise;hg.gain.value=b%2?0.12:0.06;h.connect(hf);hf.connect(hg);hg.connect(master);h.start(tt+beat/2);
    if(b%4===1||b%4===3)note(hz(ch[0]+12+(b%8>3?7:0)),tt+beat/2,beat*0.9,'sine',0.05);}
}

async function mixMusic(vsrc,murl,start=0,onProg){
  stopMusPreview();await waitVisible(); // 앱 밖에 있으면 돌아올 때까지 기다림 (화면이 꺼져 있으면 녹화가 멈춤)
  const AC=window.AudioContext||window.webkitAudioContext;const ac=new AC();let el=null;
  try{
    let buf=null;
    try{const fr=await fetch(murl);if(!fr.ok)throw new Error('music file '+fr.status);buf=await ac.decodeAudioData((await fr.arrayBuffer()).slice(0));}
    catch(e){ // 디코딩이 안 되는 형식이면 재생기로 흘려보내기
      el=new Audio();el.src=murl;el.preload='auto';el.loop=true;

    const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src=vurl;
    await new Promise((res,rej)=>{v.onloadeddata=res;v.onerror=()=>rej(new Error('video'));});
    const W=v.videoWidth||720,H=v.videoHeight||1280,dur=v.duration&&isFinite(v.duration)?v.duration:10;
    const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');g.drawImage(v,0,0,W,H);
    const stream=c.captureStream(30);const dest=ac.createMediaStreamDestination();

    if(buf){srcN=ac.createBufferSource();srcN.buffer=buf;srcN.loop=true;srcN.connect(gain);}else{ac.createMediaElementSource(el).connect(gain);}
    dest.stream.getAudioTracks().forEach(tr=>stream.addTrack(tr));
    const types=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4;codecs=avc1,mp4a','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
    const mime=types.find(x=>window.MediaRecorder&&MediaRecorder.isTypeSupported(x));if(!mime)throw new Error('rec');
    const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:6_000_000,audioBitsPerSecond:192000});const parts=[];rec.ondataavailable=e=>{if(e.data.size)parts.push(e.data);};

    const t0=ac.currentTime+0.05;gain.gain.setValueAtTime(0.0001,t0);gain.gain.exponentialRampToValueAtTime(1,t0+0.4);
    gain.gain.setValueAtTime(1,t0+Math.max(0.5,dur-1.3));gain.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    v.currentTime=0;try{await v.play();}catch(e){throw new Error('video play: '+(e.message||e));}
    if(srcN)srcN.start(t0,Math.min(start,Math.max(0,buf.duration-1)));else{el.currentTime=start||0;await el.play().catch(e=>{throw new Error('music play: '+(e.message||e));});}
    rec.start(250);
    await new Promise(res=>{let done=false;const fin=()=>{if(!done){done=true;res();}};v.onended=fin;setTimeout(fin,(dur+3)*1000);
      const draw=()=>{if(done)return;g.drawImage(v,0,0,W,H);onProg&&onProg(Math.min(1,v.currentTime/dur));
        if(v.requestVideoFrameCallback)v.requestVideoFrameCallback(draw);else requestAnimationFrame(draw);};draw();});
    g.drawImage(v,0,0,W,H);await new Promise(r=>{rec.onstop=r;rec.stop();});try{srcN&&srcN.stop();el&&el.pause();}catch(e){}
    URL.revokeObjectURL(vurl);
    const out=new Blob(parts,{type:mime.split(';')[0]});if(out.size<1000)throw new Error('empty');

  }finally{try{ac.close();}catch(e){}}
}

function txPayload(){
  const o={};for(const k in T.en){const v=T.en[k];o[k]=typeof v==='function'?v('{n}'):v;}
  for(const g in OPT)for(const x of OPT[g])if(x.n)o['opt_'+g+'_'+x.id]=x.n.en;

const txHash=str=>{let h=0;for(let i=0;i<str.length;i++)h=(h*31+str.charCodeAt(i))|0;return (h>>>0).toString(36);};
/* 글 AI (사진 같이 보낼 수 있음). json=true면 JSON으로 받아서 돌려줌 */
async function callText(prompt,images=[],asJson=false,fast=false){
  let out=null,last='';
  if(aiCfg.url&&aiCfg.key){
    const r=await fetch(aiCfg.url.replace(/\/$/,'')+'/text',{method:'POST',headers:srvH(),body:JSON.stringify({prompt,json:asJson,images,fast})});
    const d=await r.json().catch(()=>({}));if(r.ok&&d.text)out=d.text;else last=d.message||d.error||('http '+r.status);
  }else for(const m of (fast?['gemini-2.5-flash','gemini-2.5-flash-lite','gemini-flash-latest','gemini-flash-lite-latest']:['gemini-flash-latest','gemini-2.5-flash','gemini-flash-lite-latest','gemini-2.5-flash-lite'])){
    const gc=asJson?{responseMimeType:'application/json',temperature:0.2}:{temperature:0.7};if(fast&&m.startsWith('gemini-2.5'))gc.thinkingConfig={thinkingBudget:0};
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`,{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':aiCfg.gemini},
      body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt},...images.map(i=>({inline_data:{mime_type:i.mime||'image/jpeg',data:i.data}}))]}],generationConfig:gc})}).catch(e=>null);
    if(!r){last='net';continue;}const d=await r.json().catch(()=>({}));
    if(!r.ok){last=(d.error&&d.error.message)||('http '+r.status);continue;}
    out=((d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts)||[]).map(x=>x.text||'').join('');if(out)break;
  }
  if(!out)throw new Error(last||'text');
  return asJson?JSON.parse(out.replace(/^```(json)?|```$/g,'').trim()):out.trim();
}
const langEn=()=>{try{return new Intl.DisplayNames(['en'],{type:'language'}).of(lang);}catch(e){return lang;}};
async function translateUI(code,onProg){
  const src=txPayload(),js=JSON.stringify(src),key='tx-'+code,hk=txHash(js);
  try{const c=JSON.parse(localStorage.getItem(key)||'null');if(c&&c.h===hk)return c.d;}catch(e){}
  if(!aiReady())throw new Error(t('noAI'));
  let target=code;try{target=new Intl.DisplayNames(['en'],{type:'language'}).of(code);}catch(e){}
  // 한 번에 다 보내면 느리고 잘 끊겨서, 작게 나눠 동시에 번역
  const keys=Object.keys(src),N=40,parts=[];for(let k=0;k<keys.length;k+=N){const o={};for(const x of keys.slice(k,k+N))o[x]=src[x];parts.push(o);}
  let done=0,bad=0;const d={};
  const one=async part=>{
    const prompt=`Translate the VALUES of this JSON from English into ${target} (language code ${code}). It is the user interface of a mobile app that clothing shops and wholesalers use to make AI photos of their clothes on models. Use short, natural, friendly wording that a shop owner understands. Keep every key unchanged. Keep placeholders like {n}, emoji, HTML like <br>, the words "AI", "WhatsApp", "R$", sizes (PP P M G GG) and arrows exactly. Arrays stay arrays of the same length. Return ONLY the JSON object.\n\n${JSON.stringify(part)}`;
    let r=null;for(let a=0;a<2&&!r;a++){try{r=await callText(prompt,[],true,true);if(!r||typeof r!=='object')r=null;}catch(e){if(a)throw e;}}
    Object.assign(d,r||{});done++;onProg&&onProg(done/parts.length);};
  const res=await Promise.allSettled(parts.map(one));
  const fails=res.filter(x=>x.status==='rejected');
  if(fails.length===parts.length)throw fails[0].reason;
  for(const k in src){if(Array.isArray(src[k])&&!Array.isArray(d[k]))d[k]=src[k];if(d[k]===undefined||d[k]===''){d[k]=src[k];bad++;}}
  if(!fails.length)try{localStorage.setItem(key,JSON.stringify({h:hk,d}));}catch(e){}
  return d;}

const E=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const num=v=>{const n=parseFloat(String(v).replace(/\./g,'').replace(',','.'));return isNaN(n)?0:n};

/* ---------- 저장 (휴대폰 안) ---------- */
let sdb=null;
const open=()=>new Promise(r=>{try{const q=indexedDB.open('clickmoda-shop',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{sdb=q.result;r()};q.onerror=()=>r()}catch(e){r()}});
const get=k=>new Promise(r=>{if(!sdb)return r();try{const q=sdb.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()}catch(e){r()}});
const put=(k,v)=>new Promise(r=>{if(!sdb)return r();try{const tx=sdb.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>r();tx.onerror=()=>r()}catch(e){r()}});
const DEF={store:'',phone:'',pixKey:'',pixName:'',pixCity:'SAO PAULO',watermark:true,staff:'',sizes:'P,M,G,GG',nextNo:1};
const S={set:{...DEF},products:[],customers:[],orders:[],tab:'products',q:'',grp:'',ostat:'',draft:null,sendSel:null,priceMode:'hide',loaded:false,queue:[]};
const save=k=>put(k,S[k]);
async function load(){if(S.loaded)return;await open();S.set={...DEF,...(await get('set')||{})};S.products=await get('products')||[];S.customers=await get('customers')||[];S.orders=await get('orders')||[];S.loaded=true}

/* ---------- 사진 ---------- */
const loadImg=src=>new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=src});
async function shrink(src){const img=await loadImg(src);const sc=Math.min(1,1080/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.85)}
async function wmark(src){const img=await loadImg(src);const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const g=c.getContext('2d');g.drawImage(img,0,0);
  const nm=S.set.store.trim();
  if(S.set.watermark&&nm){const w=c.width,h=c.height;g.save();g.translate(w/2,h/2);g.rotate(-Math.PI/7);g.font=`800 ${Math.round(w/9)}px sans-serif`;g.textAlign='center';g.textBaseline='middle';g.fillStyle='rgba(255,255,255,.22)';g.fillText(nm,0,0);g.restore();
    const fs=Math.round(w/20);g.font=`700 ${fs}px sans-serif`;g.textAlign='right';g.textBaseline='bottom';g.shadowColor='rgba(0,0,0,.55)';g.shadowBlur=6;g.fillStyle='rgba(255,255,255,.92)';g.fillText(nm,w-fs*.6,h-fs*.5)}
  return c.toDataURL('image/jpeg',.86)}

/* ---------- Pix (BR Code) ---------- */
function crc16(x){let c=0xFFFF;for(let i=0;i<x.length;i++){c^=x.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
const plain=x=>String(x||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9 .\-]/g,'').toUpperCase().trim();
function pix(amount,txid){const st=S.set;if(!st.pixKey)return '';const f=(i,v)=>i+String(v.length).padStart(2,'0')+v;
  let key=st.pixKey.trim();
  if(/^[\d.\-\/\s]+$/.test(key)&&(dig(key).length===14||(dig(key).length===11&&/[.\-]/.test(key)&&!/^\(?\d{2}\)?\s?9/.test(key))))key=dig(key);
  else if(/^\+?[\d()\s-]+$/.test(key)&&dig(key).length>=10)key='+'+(dig(key).length<=11?'55'+dig(key):dig(key));
  let p=f('00','01')+f('26',f('00','br.gov.bcb.pix')+f('01',key))+f('52','0000')+f('53','986');
  if(amount>0)p+=f('54',amount.toFixed(2));
  p+=f('58','BR')+f('59',(plain(st.pixName||st.store)||'LOJA').slice(0,25))+f('60',(plain(st.pixCity)||'SAO PAULO').slice(0,15));
  p+=f('62',f('05',(String(txid||'').replace(/[^A-Za-z0-9]/g,'')||'***').slice(0,25)))+'6304';return p+crc16(p)}
function qrCanvas(text){try{const q=new QRLIB.QRCode(-1,QRLIB.ECL.M);q.addData(text);q.make();const n=q.getModuleCount(),sz=6,m=4,c=document.createElement('canvas');c.width=c.height=(n+m*2)*sz;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.fillStyle='#000';
  for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))g.fillRect((k+m)*sz,(r+m)*sz,sz,sz);c.style.width='210px';c.style.height='210px';return c}catch(e){return null}}

/* ---------- 계산 ---------- */
const P=x=>S.products.find(p=>p.id===x),C=x=>S.customers.find(c=>c.id===x);
const iq=it=>Object.values(it.qty||{}).reduce((a,b)=>a+(Number(b)||0),0);
const oTot=o=>o.items.reduce((a,it)=>a+iq(it)*(Number(it.price)||0),0);
const oPcs=o=>o.items.reduce((a,it)=>a+iq(it),0);
const groupsAll=()=>[...new Set(S.customers.flatMap(c=>list(c.groups)))];
const waNum=x=>{const d=dig(x);return d.length<=11?'55'+d:d};
const waLink=(phone,text)=>`https://wa.me/${waNum(phone)}?text=${encodeURIComponent(text)}`;

/* ---------- 틀 ---------- */
const TABS=['products','send','orders','customers','more'];
function render(){Q('#shTitle').textContent='🛍 '+s('title');
  Q('#shTabs').innerHTML=TABS.map(k=>`<button data-sh="tab" data-v="${k}" class="${S.tab===k?'on':''}">${s(k)}</button>`).join('');
  ({products:vProducts,send:vSend,orders:vOrders,customers:vCustomers,more:vMore})[S.tab]()}
function sheet(title,html){Q('#shBox').innerHTML=`<div class="shRow" style="margin-bottom:6px"><h2 class="shGrow" style="margin:0">${E(title)}</h2><button class="shBtn sec sm" data-sh="close">✕</button></div>${html}`;Q('#shSheet').classList.add('on');Q('#shBox').scrollTop=0}
function closeSheet(){Q('#shSheet').classList.remove('on');Q('#shBox').innerHTML='';S.draft=null}
const body=h=>{Q('#shBody').innerHTML=h};

function vProducts(){const q=S.q.toLowerCase();const ps=S.products.filter(p=>!q||(p.code+' '+p.name).toLowerCase().includes(q));
  body(`<button class="shBtn" data-sh="newProduct">${s('addProduct')}</button><button class="shBtn sec" data-sh="fromWorks">${s('fromWorks')}</button>
  <input id="shQ" placeholder="${s('search')}" value="${E(S.q)}" style="margin:6px 0 10px">
  ${ps.length?ps.map(p=>{const so=(Number(p.stock)||0)<=0;return `<div class="shCard shRow" data-sh="editProduct" data-id="${p.id}">
   ${p.photos?.[0]?`<img class="shThumb" src="${p.photos[0]}">`:`<div class="shThumb">👗</div>`}
   <div class="shGrow"><div class="shT">#${E(p.code)} ${E(p.name)}</div><div class="shS">${money(p.price)} · ${s('stockS')} ${Number(p.stock)||0}${p.minQty?' · min '+p.minQty:''}</div>
   <div>${so?`<span class="shBadge b-bad">${s('soldout')}</span>`:''}${!p.sentAt&&!so?`<span class="shBadge b-info">${s('notSent')}</span>`:''}</div></div>
   <button class="shBtn sec sm" data-sh="plus" data-id="${p.id}">${s('plus')}</button></div>`}).join(''):`<div class="shEmpty">${s('noProducts')}</div>`}`)}
let tmp=[];
function productForm(p,photos){p=p||{id:'',code:'',name:'',price:'',sizes:list(S.set.sizes),colors:'',stock:'',minQty:''};tmp=photos?[...photos]:[...(p.photos||[])];
  const sz=[...new Set([...list(S.set.sizes),...(p.sizes||[])])];
  sheet(p.id?'#'+p.code:s('addProduct').replace('+ ',''),`
  ${S.queue.length?`<div class="shHint">${s('left',S.queue.length)}</div>`:''}
  <label class="l">${s('photos')}</label><div class="shPhotos" id="shPh"></div>
  <div class="shRow" style="margin-top:8px"><button class="shBtn sec sm" data-sh="addPhoto">${s('addPhoto')}</button><button class="shBtn sec sm" data-sh="pickWorks" data-v="form">${s('fromWorks')}</button></div>
  <label class="l">${s('code')}</label><input id="f_code" value="${E(p.code)}">
  <label class="l">${s('name')}</label><input id="f_name" value="${E(p.name)}">
  <label class="l">${s('price')}</label><input id="f_price" value="${p.price!==''?String(p.price).replace('.',','):''}" inputmode="decimal" placeholder="59,90">
  <label class="l">${s('sizes')}</label><div class="chips" id="f_sizes">${sz.map(z=>`<button class="chip ${(p.sizes||[]).includes(z)?'on':''}" data-sh="chip">${E(z)}</button>`).join('')}</div>

  <button class="shBtn" data-sh="saveProduct" data-id="${p.id}" style="margin-top:16px">${S.queue.length?s('save')+' → '+s('next'):s('save')}</button>
  ${p.id?`<button class="shBtn bad" data-sh="delProduct" data-id="${p.id}">${s('del')}</button>`:''}`);drawPh()}
function drawPh(){const el=Q('#shPh');if(el)el.innerHTML=tmp.map((x,i)=>`<div><img src="${x}"><button class="x" data-sh="rmPhoto" data-i="${i}">✕</button></div>`).join('')}
function saveProduct(pid){const code=Q('#f_code').value.trim(),price=num(Q('#f_price').value);if(!code||!price)return msg(s('needCode'));
  const d={code,name:Q('#f_name').value.trim(),price,sizes:[...document.querySelectorAll('#f_sizes .chip.on')].map(b=>b.textContent),colors:Q('#f_colors').value.trim(),stock:Math.round(num(Q('#f_stock').value)),minQty:Math.round(num(Q('#f_min').value)),photos:tmp};
  if(pid)Object.assign(P(pid),d);else S.products.unshift({id:id(),createdAt:Date.now(),sentAt:null,sold:0,...d});
  save('products');msg(s('saved'));
  if(!pid&&S.queue.length){const nx=S.queue.shift();S.draft=null;productForm(null,[nx]);render();return}

let IMP=[],CON=[],conSel=new Set();
const PRE=/(?:\+?55[\s.-]?)?\(?\d{2}\)?[\s.-]?9?\d{4}[\s.-]?\d{4}/g;
function normP(x){let d=dig(x);if(d.length===10||d.length===11)d='55'+d;if(d.length<12||d.length>13||!d.startsWith('55'))return '';return '+'+d}
function fmtP(p){const d=dig(p).slice(2);return d.length===11?`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`:d.length===10?`(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`:p}
function found(name,phone){const p=normP(phone);if(!p)return;const ex=IMP.find(x=>x.phone===p);if(ex){if(!ex.name&&name)ex.name=name;return}IMP.push({name:(name||'').trim(),phone:p})}
function parseText(txt){const lines=txt.split(/\r?\n/);
  if(/BEGIN:VCARD/i.test(txt)){txt.split(/BEGIN:VCARD/i).forEach(cd=>{const fn=(cd.match(/^FN[^:]*:(.*)$/mi)||[])[1]||'';const tel=(cd.match(/^TEL[^:]*:(.*)$/mi)||[])[1];if(tel)found(fn.replace(/\\,/g,','),tel)});return}
  if(lines.slice(0,25).some(l=>/^\[?\d{1,2}\/\d{1,2}\/\d{2,4},? \d{1,2}:\d{2}/.test(l))){lines.forEach(l=>(l.match(PRE)||[]).forEach(m=>found('',m)));return}
  lines.forEach(l=>{const ms=l.match(PRE);if(!ms)return;const nm=l.replace(PRE,'').replace(/[,;\t|:]+/g,' ').replace(/\s+/g,' ').trim();ms.forEach((m,i)=>found(i===0?nm:'',m))})}
