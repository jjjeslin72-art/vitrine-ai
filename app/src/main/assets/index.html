  IMP.forEach(x=>{const c=S.customers.find(c=>normP(c.phone)===x.phone);
    if(c){c.groups=[...new Set([...list(c.groups),...g])].join(', ');if(ok)c.approved=true;u++}
    else{S.customers.push({id:id(),name:x.name||('Cliente '+x.phone.slice(-4)),phone:fmtP(x.phone),cnpj:'',city:'',groups:g.join(', '),approved:ok,note:''});a++}});
  save('customers');closeSheet();msg(`${s('impDone')} +${a} / ${u}`);render()}
// 연락처 목록 (휴대폰 앱에서만)
function conList(){const q=(Q('#conQ')?.value||'').toLowerCase();const el=Q('#conList');if(!el)return;
  const ls=CON.filter(c=>!q||(c.name+' '+c.phone).toLowerCase().includes(q)).slice(0,400);
  el.innerHTML=ls.map(c=>`<label class="shCard shRow" style="padding:8px 12px;margin-bottom:6px"><input type="checkbox" class="shChk" data-con="${E(c.phone)}" ${conSel.has(c.phone)?'checked':''}><div class="shGrow"><b>${E(c.name)}</b><div class="shS">${fmtP(c.phone)}</div></div></label>`).join('');
  Q('#conAdd').textContent=s('cAdd',conSel.size)}
function showContacts(){const box=Q('#i_con');if(!box)return;conSel=new Set();
  box.innerHTML=`<div class="shSec">① ${s('impPick')} (${CON.length})</div><input id="conQ" placeholder="${s('cSearch')}" style="margin-bottom:8px"><button class="shBtn sec sm" data-sh="conAll" style="margin-bottom:8px">${s('cAll')}</button>
  <div id="conList"></div><button class="shBtn" data-sh="conAdd" id="conAdd" style="position:sticky;bottom:0"></button>`;
  Q('#conQ').oninput=conList;conList();box.scrollIntoView({behavior:'smooth'})}

/* ---------- 통계 · 설정 ---------- */
function vMore(){const now=new Date(),mo=S.orders.filter(o=>{const d=new Date(o.date);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()});
  const tp=[...S.products].filter(p=>p.sold).sort((a,b)=>b.sold-a.sold).slice(0,5);
  const tc=S.customers.map(c=>({c,v:S.orders.filter(o=>o.customerId===c.id).reduce((a,o)=>a+oTot(o),0)})).filter(x=>x.v).sort((a,b)=>b.v-a.v).slice(0,5);const st=S.set;
  body(`<div class="shStat"><div class="shCard"><div class="shS">${s('statMonth')}</div><b>${money(mo.reduce((a,o)=>a+oTot(o),0))}</b></div><div class="shCard"><div class="shS">${s('statOrders')}</div><b>${mo.length}</b></div></div>
  <div class="shSec">${s('topP')}</div>${tp.length?tp.map((p,i)=>`<div class="shCard shRow"><b>${i+1}</b><div class="shGrow">#${E(p.code)} ${E(p.name)}</div><b>${p.sold} ${s('pcs')}</b></div>`).join(''):`<div class="shS">${s('none')}</div>`}
  <div class="shSec">${s('topC')}</div>${tc.length?tc.map((x,i)=>`<div class="shCard shRow"><b>${i+1}</b><div class="shGrow">${E(x.c.name)}</div><b>${money(x.v)}</b></div>`).join(''):`<div class="shS">${s('none')}</div>`}
  <div class="shSec">${s('settings')}</div><div class="shCard">
  <label class="l">${s('store')}</label><input id="s_store" value="${E(st.store)}">
  <label class="l">${s('myPhone')}</label><input id="s_phone" value="${E(st.phone)}" inputmode="tel">
  <label class="shRow" style="margin-top:12px;font-size:15px"><input type="checkbox" id="s_wm" class="shChk" ${st.watermark?'checked':''}> ${s('wm')}</label>
  <label class="l">${s('pixKey')}</label><input id="s_pix" value="${E(st.pixKey)}">
  <div class="shRow"><div class="shGrow"><label class="l">${s('pixName')}</label><input id="s_pixn" value="${E(st.pixName)}"></div><div class="shGrow"><label class="l">${s('pixCity')}</label><input id="s_pixc" value="${E(st.pixCity)}"></div></div>
  <label class="l">${s('staffL')}</label><input id="s_staff" value="${E(st.staff)}" placeholder="Ana, Juliana">
  <label class="l">${s('sizeL')}</label><input id="s_sizes" value="${E(st.sizes)}">
  <button class="shBtn" data-sh="saveSet" style="margin-top:14px">${s('save')}</button></div>
  <div class="shSec">${s('backup')}</div><button class="shBtn sec" data-sh="export">${s('exportB')}</button><button class="shBtn sec" data-sh="import">${s('importB')}</button>`)}
function saveSet(){Object.assign(S.set,{store:Q('#s_store').value.trim(),phone:Q('#s_phone').value.trim(),watermark:Q('#s_wm').checked,pixKey:Q('#s_pix').value.trim(),pixName:Q('#s_pixn').value.trim(),pixCity:Q('#s_pixc').value.trim(),staff:list(Q('#s_staff').value).join(', '),sizes:list(Q('#s_sizes').value).join(',')||'P,M,G,GG'});save('set');msg(s('saved'));render()}
function doExport(){const j=JSON.stringify({app:'clickmoda-shop',v:1,date:new Date().toISOString(),set:S.set,products:S.products,customers:S.customers,orders:S.orders});const name=`clickmoda-loja-${new Date().toISOString().slice(0,10)}.json`;
  if(AB&&AB.saveFile){const b64=btoa(unescape(encodeURIComponent(j)));const r=AB.saveFile(name,b64,'application/json','');msg(String(r).startsWith('ok')?s('exported'):String(r));return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));a.download=name;document.body.append(a);a.click();setTimeout(()=>a.remove(),500)}
function doImport(txt){try{const j=JSON.parse(txt);['products','customers','orders'].forEach(k=>{if(Array.isArray(j[k])){S[k]=j[k];save(k)}});if(j.set){S.set={...DEF,...j.set};save('set')}msg(s('imported'));render()}catch(e){msg(s('fileFail'))}}

/* ---------- 휴대폰 다리 (파일·연락처) ---------- */
const waitFile={};
window.__textFile=(fid,text,err)=>{const f=waitFile[fid];delete waitFile[fid];if(f)f(text||'',err||'')};
window.__contacts=(fid,json,err)=>{const f=waitFile[fid];delete waitFile[fid];if(f)f(json,err||'')};
function pickText(){return new Promise(r=>{if(AB&&AB.pickTextFile){const k='tf'+id();waitFile[k]=(t,e)=>{if(e&&e!=='cancel')msg(s('fileFail'));r(t)};AB.pickTextFile(k)}
  else{const i=document.createElement('input');i.type='file';i.accept='.txt,.vcf,.csv,.json,text/*';i.onchange=async()=>{r(i.files[0]?await i.files[0].text():'')};i.click()}})}
function pickPhoto(){return new Promise(r=>{if(AB&&AB.pickPhotos){const k='shop'+id();photoWait[k]=a=>r(Array.isArray(a)?a:(a?[a]:[]));AB.pickPhotos(k,10)}
  else{const i=document.createElement('input');i.type='file';i.accept='image/*';i.multiple=true;i.onchange=async()=>{const o=[];for(const f of i.files)o.push(await new Promise(q=>{const fr=new FileReader();fr.onload=()=>q(fr.result);fr.readAsDataURL(f)}));r(o)};i.click()}})}
async function openContacts(){if(!(AB&&AB.pickContacts)){ // 브라우저: Contact Picker
    if('contacts' in navigator&&navigator.contacts.select){try{const r=await navigator.contacts.select(['name','tel'],{multiple:true});r.forEach(c=>(c.tel||[]).slice(0,1).forEach(p=>found((c.name||[])[0]||'',p)));showFound()}catch(e){}}else msg('Android app only');return}
  const k='ct'+id();waitFile[k]=(json,err)=>{if(err==='perm'){msg(s('cPerm'));return}let a=[];try{a=JSON.parse(json||'[]')}catch(e){}
    const seen=new Set();CON=[];a.forEach(c=>{const p=normP(c.phone);if(p&&!seen.has(p)){seen.add(p);CON.push({name:c.name||'',phone:p})}});CON.sort((x,y)=>x.name.localeCompare(y.name));showContacts()};
  AB.pickContacts(k)}

/* ---------- 버튼 ---------- */
let arm='';
const armed=k=>{if(arm===k)return true;arm=k;msg(s('delAgain'));setTimeout(()=>arm='',3000);return false};
async function onClick(e){
  if(e.target.id==='shSheet'){closeSheet();return}
  const b=e.target.closest('[data-sh]');if(!b)return;const a=b.dataset.sh,x=b.dataset.id;
  if(b.tagName!=='A'&&a!=='conChk')e.preventDefault();
  switch(a){
    case 'tab':S.tab=b.dataset.v;S.q='';S.grp='';render();Q('#shBody').scrollTop=0;break;
    case 'close':closeSheet();break;
    case 'newProduct':S.queue=[];productForm();break;
    case 'fromWorks':pickWorks('new');break;
    case 'pickWorks':pickWorks.vals={};['f_code','f_name','f_price','f_colors','f_stock','f_min'].forEach(k=>{const el=Q('#'+k);if(el)pickWorks.vals[k]=el.value});pickWorks('form');break;
    case 'pk':pickSel.has(x)?pickSel.delete(x):pickSel.add(x);b.classList.toggle('on');Q('#pkDone').textContent=s('pickDone',pickSel.size);break;
    case 'pkDone':pickDone();break;
    case 'editProduct':S.queue=[];productForm(P(x));break;
    case 'plus':{e.stopPropagation();const p=P(x);p.stock=(Number(p.stock)||0)+1;save('products');render();break}
    case 'chip':b.classList.toggle('on');break;
    case 'addPhoto':{const arr=await pickPhoto();for(const u of arr){try{tmp.push(await shrink(u))}catch(er){}}drawPh();break}
    case 'rmPhoto':tmp.splice(+b.dataset.i,1);drawPh();break;
    case 'saveProduct':saveProduct(x);break;
    case 'delProduct':if(armed(a+x)){S.products=S.products.filter(p=>p.id!==x);save('products');closeSheet();render()}break;
    case 'togSend':S.sendSel.has(x)?S.sendSel.delete(x):S.sendSel.add(x);render();break;
    case 'pmode':S.priceMode=b.dataset.v;render();break;
    case 'grp':S.grp=b.dataset.v;render();break;
    case 'share':doShare();break;
    case 'copyCap':copyTxt(Q('#shCap').value);break;
    case 'newOrder':S.draft={customerId:'',staff:'',delivery:'dExc',note:'',items:[]};orderForm();break;
    case 'rmItem':keep();S.draft.items.splice(+b.dataset.i,1);orderForm();break;
    case 'saveOrder':saveOrder();break;
    case 'ostat':S.ostat=b.dataset.v;render();break;
    case 'viewOrder':viewOrder(x);break;
    case 'setStat':{const o=S.orders.find(y=>y.id===x);o.status=b.dataset.v;save('orders');render();viewOrder(x);break}
    case 'copyPix':copyTxt(b.dataset.v);break;
    case 'copyOrder':copyTxt(orderText(S.orders.find(y=>y.id===x)));break;
    case 'reorder':reorder(x);break;
    case 'delOrder':if(armed(a+x)){S.orders=S.orders.filter(o=>o.id!==x);save('orders');closeSheet();render()}break;
    case 'newCustomer':customerForm();break;
    case 'editCustomer':customerForm(C(x));break;
    case 'saveCustomer':saveCustomer(x);break;
    case 'delCustomer':if(armed(a+x)){S.customers=S.customers.filter(c=>c.id!==x);save('customers');closeSheet();render()}break;
    case 'importOpen':importForm();break;
    case 'conOpen':openContacts();break;
    case 'conAll':{const q=(Q('#conQ').value||'').toLowerCase();const ls=CON.filter(c=>!q||(c.name+' '+c.phone).toLowerCase().includes(q));const all=ls.every(c=>conSel.has(c.phone));ls.forEach(c=>all?conSel.delete(c.phone):conSel.add(c.phone));conList();break}
    case 'conAdd':CON.filter(c=>conSel.has(c.phone)).forEach(c=>found(c.name,c.phone));Q('#i_con').innerHTML='';showFound();break;
    case 'impFile':{const t=await pickText();if(t){parseText(t);showFound()}break}
    case 'impPaste':parseText(Q('#i_txt').value);showFound();break;
    case 'impSave':importSave();break;
    case 'saveSet':saveSet();break;
    case 'export':doExport();break;
    case 'import':{const t=await pickText();if(t)doImport(t);break}
  }}
document.addEventListener('click',e=>{if(e.target.closest('#shop,#shSheet'))onClick(e)});
document.addEventListener('change',e=>{const c=e.target.dataset&&e.target.dataset.con;if(c){e.target.checked?conSel.add(c):conSel.delete(c);Q('#conAdd').textContent=s('cAdd',conSel.size)}});
document.addEventListener('input',e=>{if(e.target.id==='shQ'){S.q=e.target.value;const pos=e.target.selectionStart;render();const q=Q('#shQ');q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}});

/* ---------- 열기 / 닫기 / 뒤로 ---------- */
async function openShop(tab){await load();if(tab)S.tab=tab;try{if(Q('#viewer').classList.contains('on'))closeViewer()}catch(e){}Q('#shop').classList.add('on');render()}
function closeShop(){closeSheet();Q('#shop').classList.remove('on')}
Q('#shClose').onclick=closeShop;
const prevBack=window.__appBack;
window.__appBack=()=>{if(Q('#askSheet')&&Q('#askSheet').classList.contains('on')){Q('#askSheet').classList.remove('on');return true}
  if(Q('#shSheet').classList.contains('on')){closeSheet();return true}if(Q('#shop').classList.contains('on')){closeShop();return true}return prevBack?prevBack():false};
return {open:openShop,close:closeShop,fromPhotos,_S:S,_pix:pix,_parse:parseText,_imp:()=>IMP};
})();
</script>
<script>
'use strict';
$('#vShop').onclick=()=>{if(viewing&&viewing.img&&window.SHOP)SHOP.fromPhotos([viewing.img]);};
$('#selShop').onclick=()=>{const imgs=galList.filter(q=>selSet.has(q.id)&&q.img&&!q.video).map(q=>q.img);if(!imgs.length)return;setSel(false);window.SHOP&&SHOP.fromPhotos(imgs);};
</script>
</body>
