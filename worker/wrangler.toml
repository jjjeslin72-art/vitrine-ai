name = "vitrine-ai"
main = "src/index.js"
compatibility_date = "2026-09-01"

# 기기 하나당 1분에 30번까지만 (요금 폭탄 방지)
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[vars]
MODEL = "gemini-3.1-flash-image"
FALLBACK_MODEL = "gemini-3-pro-image"

# 사용량 기억 장소 (출시 때 켜기): Cloudflare > Workers KV 에서 "vitrine-usage" 만들고 id를 아래에 넣은 뒤 주석(#) 지우기
# [[kv_namespaces]]
# binding = "USAGE"
# id = "여기에_KV_ID"

# FREE_TRIAL = "5"   # 구독 안 한 기기가 무료로 만들 수 있는 장 수
